# NoteAIProvider 계약 · AI 실패 타입 · 테스트 전용 fake provider
# Runtime이 PLAN-20260903T053705Z 승인 시점에 생성했다 (proposal P3). 계획 서술은 여기 남기지 않는다.

id: TASK-034
status: DONE

request: |-
  벤더 중립 provider 계약을 만든다(예: src-tauri/src/ai/provider.rs). 계약이 담는 것: provider 식별자와 사람이 읽을 이름, **로컬인지 외부인지의 구분**(§12 · INV-5 — UI가 이 값을 읽어 사용자에게 알린다), 사용 가능한지 확인하는 수단(§9.2의 isAvailable에 해당 · INV-8), 사용할 수 있는 모델 목록, 그리고 P2의 mode와 준비된 transcript 텍스트로 structured note를 만드는 생성. 생성 요청 타입에는 **오디오 경로나 오디오 바이트를 담을 자리가 없다** — INV-6을 타입 수준에서 보장한다. 다음으로 domain::failure에 §13의 AI Provider 실패를 나타내는 FailureKind를 추가한다: provider 미설정 · 연결 불가 · 모델 없음 · 요청 실패 · 응답이 기대 schema와 다름. 각각의 retryable과 source_data_safe를 ADR-0008의 매핑 표대로 정하고(어떤 AI 실패도 원본을 훼손하지 않는다 · INV-3), 기존 규약대로 as_str 문자열이 서로 겹치지 않으며 src/ipc/failure.ts의 union과 1:1로 유지되도록 frontend 타입도 함께 갱신한다. 마지막으로 **테스트 전용 fake provider**를 만든다 — 결정론적으로 응답하고, 정상 응답뿐 아니라 schema에 어긋난 응답과 연결 불가 상황도 낼 수 있어야 한다. fake는 제품 UI에 노출되는 선택지가 **아니다**. 계약 준수 테스트는 **구현을 인자로 받아 재사용할 수 있는 형태**로 쓴다 — 같은 묶음을 P5의 Ollama adapter가 그대로 통과해야 하기 때문이다. transcription::engine과 testing::StubEngine이 같은 목적으로 쓰인 기존 형태를 참고한다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-033

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC1
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      test Gate가 통과한다.
    verification:
      type: gate
      ref: test
  - id: AC4
    description: |-
      생성 요청 타입에 오디오(경로 · 바이트 · 파일 핸들)를 담을 자리가 없고, 그 사실이 테스트나 타입으로 확인된다 (INV-6).
    verification:
      type: verifier
      instruction: |-
        요청 타입의 필드를 전부 읽는다. 오디오를 담을 수 있는 필드가 하나라도 있으면 FAIL이다.
  - id: AC5
    description: |-
      AI provider 실패 다섯 종류가 서로 구분되는 FailureKind로 추가되고, 문자열이 src/ipc/failure.ts의 union과 1:1이며, 전부 source_data_safe다.
    verification:
      type: verifier
      instruction: |-
        Rust의 as_str 값 목록과 frontend union을 대조한다. 누락 · 오타 · 중복이 있으면 FAIL이다. ADR-0008의 매핑 표와 retryable 값도 대조한다.
  - id: AC6
    description: |-
      계약 준수 테스트가 특정 구현에 묶이지 않고 임의의 구현에 적용할 수 있는 형태로 작성되어 있으며, fake provider가 그것을 통과한다.
    verification:
      type: verifier
      instruction: |-
        테스트가 구현을 인자/제네릭으로 받는지 확인한다. fake 전용으로 하드코딩된 단언만 있으면 FAIL이다.
  - id: AC7
    description: |-
      fake provider가 제품 코드 경로에서 사용자가 고를 수 있는 provider로 노출되지 않는다.
    verification:
      type: verifier
      instruction: |-
        fake가 cfg(test) 등 테스트 전용 경계 안에 있거나, 제품의 provider 선택 목록에 포함되지 않는지 확인한다.

