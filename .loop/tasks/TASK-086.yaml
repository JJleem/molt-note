# ADR-0007에 전사 청크 분할 규칙을 확정한다 (문서 전용)
# Runtime이 PLAN-20260907T074302Z 승인 시점에 생성했다 (proposal P1). 계획 서술은 여기 남기지 않는다.

id: TASK-086
status: DONE

request: |-
  문서만 바꾸는 Task다 — `src-tauri/` 아래의 소스 · `Cargo.toml` · 설정 · 테스트를 하나도 건드리지 않는다. `docs/ADR-0007-transcription-engine.md`에 새 절(§20)을 **뒤에 덧붙여** 전사 청크 분할 규칙을 확정한다. 기존 §17 · §18 · §19의 문장을 지우거나 다시 쓰지 않는다 — §18이 §17에 대해 한 것과 같은 형태다. 확정할 것은 여덟이다. (1) **청크 길이와 그 근거** — `phase-prompt/05.8-transcription-chunking.md` P-2가 기록한 2026-09-05 실험의 120초이며, 그 값이 관측에서 온 것이지 추정이 아니라는 것을 근거로 적는다. (2) **청크마다 whisper state를 재생성한다는 것** — 무엇을 재생성하고(state) 무엇을 재사용하는가(모델 context), 그리고 왜 그 경계인가. (3) **겹침(overlap)을 둘 것인가** — 두지 않기로 하면 그 이유를, 두기로 하면 겹친 구간의 segment를 어떻게 병합해 중복을 남기지 않는지 규칙으로 적는다. 9/5 기록에 겹침에 대한 명시가 없다는 사실도 함께 적는다. (4) **청크 로컬 timestamp를 전체 시간축으로 되돌리는 규칙** — 오프셋을 **원시 단위(센티초)** 로 더한다는 것과, 그것이 §10의 '단위 변환은 parse 한 곳에서만 일어난다'를 어떻게 깨지 않는지. 어느 값이 원시이고 어느 값이 정규화된 값인지가 문서에서 분명해야 한다. (5) **연속 반복 차단의 정의와 임계값** — 무엇을 '연속 반복'으로 세는가(문장 정규화 방식은 §18.2가 이미 정한 것과 같은지 다른지 명시), 9/5가 쓴 '연속 3회 초과 차단'이 정확히 무엇을 뜻하는가, 그리고 그 임계값이 **코드의 한 자리에만** 정의된다는 것. (6) **여러 청크의 결과를 하나의 `RawTranscription`으로 합칠 때 `language` 보고 값을 어떻게 정하는가** — 설정 값을 베껴 넣는 경로를 만들지 않는다는 §17.1.4-3을 유지한 채. (7) **이 규칙이 사는 자리** — 파일시스템 · 저장소 · 네트워크 · 엔진을 모르는 순수 모듈 하나이며 `collapse.rs` · `parse.rs`가 세운 선례를 따른다는 것, 그리고 `TranscriptionEngine` trait(`transcription/engine.rs:106`)의 형태는 바뀌지 않고 청킹은 그 구현 **안쪽**의 일이라는 것. (8) **이 절이 하지 않는 것** — 엔진 교체 · 디코딩 파라미터 튜닝(VAD · `no_speech_thold` · `entropy_thold` · `temperature`) · 모델 강제 · 녹음 레벨 정규화 · 붕괴 판정 대체. 마지막으로 §18.7이 한 것처럼 `[관측된 사실]` · `[유력한 설명]` · `[미검증]`을 구분한 표를 두고, 임계값의 근거가 한 실험뿐이라는 것과 '정상적으로 반복된 발화가 차단될 수 있는가'가 미검증이라는 것을 감추지 않고 적는다. 머리말의 Status · Date · Phase · Task · Scope에도 이 갱신을 **덧붙인다** (원래 줄을 지우지 않는다).

