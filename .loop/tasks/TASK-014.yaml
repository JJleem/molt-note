# 번들 .app 실행 절차 문서화와 ADR-0003 자동 검증 근거 갱신
# Runtime이 PLAN-20260902T061156Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-014
status: DONE

request: |-
  사람이 spike를 실제로 실행해 장치 증거를 얻을 수 있도록 절차를 문서로 확정한다. 문서 전용 Task이며 소스 · 매니페스트 · 설정은 건드리지 않는다. 대상은 `docs/ADR-0003-recording-engine.md`이거나 그 문서가 링크하는 별도 문서다. 내용: (1) **정확한 명령/조작 순서** — 번들된 `.app`을 만드는 명령, 산출물이 놓이는 경로, 앱을 실행하는 방법, 앱에서 무엇을 클릭하는지, 출력 파일이 어디에 생기는지, 그 파일의 포맷과 크기를 확인하는 방법. 명령은 이 저장소의 `package.json` 스크립트와 실제 경로에 근거해 적고, 존재하지 않는 명령을 지어내지 않는다. (2) **왜 터미널/dev 실행으로는 부족한지** — macOS 권한은 실행 주체에 귀속되므로 터미널에서 띄우면 권한이 터미널 앱에 붙고, 제품이 겪을 상황과 다르다(§14.3 · Tauri #11951). 그래서 번들된 `.app`에서 확인해야 한다는 것을 적는다. (3) **Human Review 결과 기록표** — 8개 항목(권한 프롬프트 · 선택한 물리 마이크 사용 · 장치 열기 · 10~20초 녹음 성공 · 출력 파일 존재 · 음성 가청성 · 실제 컨테이너/코덱/PCM 포맷과 §14.4 whisper 입력 요구의 대조 · Stop 확정의 무손상)을 사람이 채울 빈 칸(PENDING)으로 둔다. 짧은 smoke recording이면 충분하고 1시간 테스트가 아니라는 점을 적는다. (4) **ADR-0003의 자동 검증 근거 절을 갱신한다** — P2~P4에서 이 저장소가 실제로 증명한 것(해석된 의존성 버전 · 자동 테스트가 덮는 순수 로직 · 코드가 만들도록 되어 있는 포맷)만 적고, 실행해 보지 않은 것은 적지 않는다. 상태는 여전히 `PROVISIONAL — pending human device validation`으로 유지한다. Worker는 번들 빌드를 실행하지 않아도 되며, 실행하지 않은 결과를 관찰된 사실로 적지 않는다. Human Review 항목을 통과했다고 적지 않는다. `docs/SYSTEM-MAP.md`는 이 Task에서 갱신하지 않는다(Phase 최종 DONE 시점의 일이다). git commit은 하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-013

