  gates: []
  requires_verifier: true
  max_consecutive_failures: 2

acceptance_criteria:
  - id: AC1
    description: |-
      사람이 spike를 실행하는 방법이 정확한 명령/조작 순서로 적혀 있고, 명령과 경로가 저장소의 실제 스크립트·구조와 일치한다.
    verification:
      type: verifier
      instruction: |-
        문서의 명령을 package.json 스크립트 · tauri.conf.json · 실제 파일 구조와 대조한다. 존재하지 않는 명령이나 경로가 있으면 실패다.
  - id: AC2
    description: |-
      번들된 `.app`에서 확인해야 하는 이유(터미널 실행 시 권한 귀속 차이)가 적혀 있고, spike가 번들 앱에서 실행 가능한 경로로 문서화되어 있다.
    verification:
      type: verifier
      instruction: |-
        §14.3의 권한 관련 사실과 대조해 서술이 근거를 갖는지 확인한다.
  - id: AC3
    description: |-
      Human Review 8개 항목이 사람이 채울 빈 기록표로 존재하고, 어느 항목도 통과/확인됨으로 미리 채워져 있지 않다.
    verification:
      type: verifier
      instruction: |-
        8항목이 모두 있고 상태가 미기입(PENDING)인지 확인한다. 하나라도 결과가 채워져 있으면 실패다.
  - id: AC4
    description: |-
      ADR-0003의 자동 검증 근거가 P2~P4에서 실제로 증명된 것만으로 갱신되었고, 상태는 여전히 PROVISIONAL이며, 저장소 근거 · 자동 검증 · Human Review의 구분이 유지된다.
    verification:
      type: verifier
      instruction: |-
        갱신된 서술을 실제 코드·테스트·매니페스트와 대조한다. 실행되지 않은 결과가 사실로 적혀 있거나 상태가 확정으로 바뀌었으면 실패다.
  - id: AC5
    description: |-
      이 Task는 문서만 변경했다 — 소스 · 매니페스트 · 설정 · `docs/SYSTEM-MAP.md` 변경이 없다.
    verification:
      type: verifier
      instruction: |-
        변경된 파일 목록을 확인한다.

