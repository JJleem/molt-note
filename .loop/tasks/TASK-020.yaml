        확인한다: (1) 'spike' 임시 표기와 spike 전용 모듈이 src/ 아래에 남아 있지 않다, (2) §5-B의 네 요소가 모두 있다, (3) 경과 시간이 backend가 준 값이며 TypeScript가 다시 계산하지 않는다, (4) permission denied와 초기화 실패가 각각 구분되어 화면 상태로 표현된다, (5) 녹음 session이 이 컴포넌트의 mount/unmount에 묶이지 않는다(R-001).

