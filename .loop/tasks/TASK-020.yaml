# Recording 화면 — spike 표면을 production UI로 대체
# Runtime이 PLAN-20260902T080012Z 승인 시점에 생성했다 (proposal P6). 계획 서술은 여기 남기지 않는다.

id: TASK-020
status: DONE

request: |-
  Phase 2A의 임시 spike 표면을 **남기지 않고** 대체한다. `src/screens/RecordingScreen.tsx`를 §5-B와 §19를 따르는 실제 녹음 화면으로 다시 만들고, `src/screens/captureSpikeView.ts`와 그 테스트를 production view 모듈로 대체하며, 'Phase 2A spike — temporary surface' 같은 임시 표기와 쓰이지 않게 된 spike 전용 command 표면을 저장소에서 없앤다. 화면이 보여주는 것: 제목 · 선택된 microphone(P4의 default 값과 해석 결과 — 특히 '저장된 장치가 지금 없다'가 사용자에게 보인다) · **경과 시간(backend가 준 문자열 그대로)** · Record / Pause / Resume / Stop. 녹음 중이라는 사실과 경과 시간이 가장 크고 명확해야 하며 장식적 효과를 넣지 않는다. §13의 실패 중 **최소한 permission denied와 녹음 초기화 실패**가 화면 상태로 표현되고, 기존 FailureNotice와 같은 모양으로 보인다. Stop이 성공하면 저장된 녹음이 Recordings 목록에서 보이게 이어진다. 상태를 만드는 규칙은 DOM 없이 테스트되는 순수 모듈에 두고 화면은 그리기만 한다. TypeScript에 길이 포맷 계산을 만들지 않는다. commit하지 않는다.

execution:
  role: impl

