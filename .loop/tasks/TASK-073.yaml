  - id: AC4
    description: |-
      사용자가 산출물의 크기를 알 수 있고, 예산을 넘는 경우 나눠 가져가는 수단이 화면 값으로 존재한다. 잘린 결과를 완전한 것처럼 말하는 상태가 없다.
    verification:
