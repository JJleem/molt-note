# 크기와 나눔을 command 경계와 AI Note 탭까지 잇는다
# Runtime이 PLAN-20260905T201413Z 승인 시점에 생성했다 (proposal P8). 계획 서술은 여기 남기지 않는다.

id: TASK-073
status: DONE

request: |-
  P7이 만든 규칙을 사람이 실제로 쓰는 자리까지 잇는다. (1) `src-tauri/src/export/handoff.rs`가 세 산출물(Manual 프롬프트 · Transcript 텍스트 · AI-ready 문서)에 대해 크기와 나눔을 다루도록 하고, `src-tauri/src/commands/export.rs` · `notes` 쪽 경계와 `payload.rs`가 그것을 wire로 나른다. **command 이름을 늘리지 않는 편을 우선한다** — 기존 `get_ai_prompt` · `get_transcript_text` · `export_ai_request`의 인자(가져갈 조각)와 응답(크기 · 전체 조각 수 · 지금 조각)을 넓히면 ADR-0010 §8.1의 '사용자 동작 하나에 이름 하나'와 `tests/ipc-boundary.test.ts`의 표면 검사가 함께 유지된다. 세 이름 모두 여전히 `recordingId`만 받고 `transcriptId`를 받지 않는다(MH-5). 벤더 고유 개념을 payload · frontend 타입에 새로 만들지 않는다(INV-9). (2) `src/ipc/types.ts` · `src/ipc/commands.ts`를 그에 맞게 갱신한다. (3) 표현 규칙은 순수 모듈에 둔다 — `src/screens/copyView.ts`와 `src/screens/aiHandoffView.ts`가 **얼마나 큰가**와 **어떻게 나눠 가져가는가**를 값으로 말한다: 한 번에 들어가지 않을 수 있다는 사실, 지금 가져가는 것이 몇 번째 중 몇 번째인지, 나머지를 마저 가져가는 수단. 크기 때문에 조용히 실패하거나 잘린 문서를 성공이라고 말하는 상태가 없어야 한다. 파일로 내보내는 길은 나뉜 조각마다 파일이 생기더라도 **이미 있는 파일을 덮어쓰지 않는다**(ADR-0009 §4.3). (4) `src/screens/RecordingDetailScreen.tsx`의 AI Note 탭이 그 값을 그린다 — Phase 5.5가 세운 두 줄 구조(자동 / 내 AI로 하기)를 바꾸지 않고 그 안에 얹는다. provider가 없어도 아래 줄이 그대로 동작한다는 불변(MH-1 · MH-2)이 유지돼야 한다.

