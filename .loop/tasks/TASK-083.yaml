request: |-
  문서와 절차만 만드는 Task다 — **제품 소스 · 설정 · 의존성을 건드리지 않고, 정규화를 제품 기능으로 구현하지 않는다.** `docs/PHASE-3-TRANSCRIPTION-SMOKE-TEST.md`에 2026-09-07 부록을 **덧붙인다** — 기존 §10 표도 2026-09-05 부록도 지우거나 다시 쓰지 않는다(9/5의 선례를 따른다). 담을 것: (1) 원본 `capture-1788746454.wav`(280 MB · 48 kHz mono 16-bit · 50.99분)를 **읽기만 하고** 레벨을 올린 사본을 따로 만드는 절차 — 표준 도구만 쓰고, 원본을 덮어쓰거나 옮기지 않으며(INV-1), 사본이 놓이는 자리와 클리핑을 어떻게 피하는지가 적혀 있어야 한다. (2) 그 사본을 제품 경로로 전사하는 절차(언어 `ko` · 같은 모델 `ggml-large-v3-turbo.bin` · 기존 문서의 경로 B 선례). (3) 결과를 재는 방법 — 총 segment 수 · 고유 문장 수와 비율 · 최다 반복 문장의 점유율 · 소요 시간, 그리고 2026-09-07 원본 실행값(103 · 2 · 1.9% · 99.0% · 4.30분)과 나란히 놓는 표. (4) 결과. **실행할 수 있으면 실행해 실제 값을 적는다. 실행할 수 없으면 무엇이 막았는지(모델 파일 · 오디오 부재 · 시간 · 권한)를 명시하고 결과칸을 `[미측정]`으로 남긴다 — 측정하지 않은 값을 지어내지 않는다.** [관측된 사실] · [유력한 설명] · [미검증] 구분을 지키고, 레벨이 유일한 원인이라고 단정하지 않는다. 측정 결과에 따른 제품 결정(정규화를 넣을 것인가)은 이 Task가 내리지 않고 다음 후보로 적어 둔다.

