      automatic_transcription이 automatic_processing과 별개의 값으로 존재하고 기본값이 OFF다. 하나의 boolean에 두 의미가 겹치지 않는다는 것이 테스트로 확인된다.
    verification:
      type: verifier
  - id: AC5
    description: |-
      새 migration이 목록 끝에 추가됐고 기존 migration의 version·sql이 수정되지 않았으며, 이미 저장된 설정 값이 보존된다는 테스트가 있다.
    verification:
