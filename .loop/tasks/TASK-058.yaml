    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC-2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC-3
    description: |-
      test Gate가 통과하고, 복사 상태 네 갈래(아직 안 함 · 복사 중 · 복사됨 · 실패)가 clipboard 없이 순수 모듈 테스트로 판정된다.
    verification:
      type: gate
      ref: test
  - id: AC-4
    description: |-
      clipboard를 실제로 부르는 자리가 저장소에 정확히 하나이고, React 컴포넌트에 흩어져 있지 않다.
    verification:
      type: verifier
      instruction: |-
        `src/`와 `src-tauri/src/`에서 clipboard 호출 지점을 전수 검색해 한 곳인지 확인한다.
  - id: AC-5
    description: |-
      복사 실패가 사용자에게 보이고 재시도 가능하며, console로만 남는 경로가 없다. 실패 표시가 색만으로 말하지 않는다.
    verification:
      type: verifier
  - id: AC-6
    description: |-
      자동 테스트가 실제 시스템 clipboard를 건드리지 않는다 — 경계가 test double로 대체된다.
    verification:
      type: verifier

