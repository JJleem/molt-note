# AI Note 탭의 위계 변경 — 자동 생성과 Manual Handoff 두 줄
# Runtime이 PLAN-20260904T075433Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-059
status: DONE

request: |-
  `src/screens/RecordingDetailScreen.tsx`의 AI Note 탭에서 **provider 부재가 '설정하라는 요구'가 아니라 정상적으로 지원되는 상태**로 보이게 위계를 바꾼다. 화면은 두 줄이다 — 위는 '자동으로 만들기'(연결된 provider로 생성), 아래는 '내 AI로 하기'(Copy AI Prompt · Copy Transcript · Export for AI). **provider가 하나도 없어도 아래 줄은 완전히 쓸 수 있어야 한다**. 공격적인 설정 유도 문구를 넣지 않는다. 판정 로직은 기존 규약대로 순수 모듈에 둔다 — `src/screens/aiNoteView.ts`를 확장하거나 그 옆에 순수 모듈을 하나 더해서, 무엇을 보여줄지 · 무엇이 지금 가능한지 · 복사와 export의 결과와 실패를 어떻게 표현할지를 DOM 없이 판정 가능한 값으로 만든다. 비즈니스 로직을 컴포넌트로 옮기지 않는다 (R-2 · E-13). 세 동작은 P3의 command와 P4의 clipboard 경계를 통해서만 수행하고, mode 선택은 기존 세 mode(Meeting · Study · Summary)를 그대로 쓴다. **탭 구성 `['AI Note','Transcript','Recording']`과 기존 `share` 섹션(Export Markdown · Send to Notion)을 갈아엎지 않는다** — 최소 변경으로 간다. 기존 Connected Provider 생성 경로(mode 선택 · 생성 · 재생성 · 이력 · provenance · 실패 표시)가 그대로 살아 있어야 하고 (MH-8), 기존 `aiNoteView` 테스트가 계속 통과해야 한다. 실패는 §13대로 사용자에게 보이고 재시도 수단을 남긴다 (MH-7).

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
