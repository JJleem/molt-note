    description: |-
      test Gate가 통과한다. 파일 존재·최소 크기·포맷·레코드 영속화 네 조건과, 두 어긋난 상태(audio만 있음 / row만 있음)의 처리가 테스트로 판정된다.
    verification:
      type: gate
      ref: test
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC4
    description: |-
      파일 생성과 DB 저장의 순서·보상 정책이 문서에 명시되어 있고 구현이 그 정책과 일치한다. 실패 경로 어디에도 이미 만들어진 audio 파일을 삭제하는 코드가 없다(INV-4).
    verification:
      type: verifier
      instruction: |-
        문서와 소스를 대조한다: (1) 순서와 보상 정책이 문서에 적혀 있고 두 어긋난 상태 각각의 처리가 명시되어 있다, (2) 구현이 그 정책대로다, (3) audio 파일을 지우는 경로가 사용자의 명시적 삭제 밖에 존재하지 않는다, (4) DB 저장 실패 시 확정된 파일 경로가 사용자에게 전달된다, (5) 저장되는 duration이 pause를 제외한 값이다.

