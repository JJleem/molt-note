      ref: test
  - id: AC3
    description: |-
      feature가 실제로 빌드에 영향을 준다는 근거가 확인돼 evidence로 남아 있다 — manifest 기재만으로 켜졌다고 주장하지 않는다.
    verification:
      type: verifier
      instruction: |-
        evidence 파일이 무엇을 어떻게 확인했는지 읽고, 관측 사실과 추론이 구분돼 있는지 본다.
  - id: AC4
    description: |-
      측정하지 않은 성능 수치가 Cargo.toml 주석 · evidence · 문서 어디에도 새로 적히지 않았다. 이 Task가 제품 소스를 바꾸지 않았다.
    verification:
      type: verifier

