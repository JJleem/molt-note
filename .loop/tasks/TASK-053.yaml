# Phase 5 불변 규칙 전용 자동 테스트
# Runtime이 PLAN-20260904T025945Z 승인 시점에 생성했다 (proposal P11). 계획 서술은 여기 남기지 않는다.

id: TASK-053
status: DONE

request: |-
  새 제품 기능을 추가하지 않고, **이미 만들어진 경로**로 이 Phase의 불변을 전용 테스트에 못박는다 (Phase 4의 같은 성격 Task와 같은 방식이며, 필요하면 `src-tauri/tests/` 아래 통합 테스트와 `src/`의 view 테스트 양쪽에 둔다): (a) **AI Note가 하나도 없는 Recording**의 Markdown export와 Notion 전송이 성공한다 (INV-8 · §17.1); (b) **1시간 분량 규모의 transcript**가 분할되어 순차 전송되고, 보낸 것을 이어 붙이면 원문과 정확히 같다 — 잘리지도 조용히 유실되지도 않는다; (c) Notion 실패(인증 실패 · 권한 없는 destination · 네트워크 없음 · 중간 chunk 실패) 뒤에도 recording · transcript · ai_note가 그대로이고 재시도가 가능하다 (INV-3); (d) 오디오 바이트도 오디오 경로도 Notion 요청 본문에 들어가지 않는다 (INV-6); (e) token이 SQLite 스키마 · frontend 소스 · 실패 message/detail 어디에도 없다 (INV-7); (f) 두 renderer가 provider 중립 Structured Note를 소비하며 벤더 고유 응답 형태에 의존하지 않는다 (INV-9). 모든 테스트는 **실제 Notion API 호출 없이** stub transport로, **실제 OS 자격증명 저장소 접근 없이** 메모리 double로, 실제 사용자 디렉터리 대신 임시 디렉터리에서 돈다 (§18). 이미 있는 테스트와 중복되면 새로 쓰지 말고 그 테스트를 가리키는 근거를 남긴다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-051
  - TASK-052

