# Ollama adapter — HTTP 경계 분리와 실패 매핑
# Runtime이 PLAN-20260903T053705Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-036
status: DONE

request: |-
  첫 번째 provider 구현으로 로컬 Ollama adapter를 만든다(예: src-tauri/src/ai/ollama/). 벤더 지식(엔드포인트 · 요청 형태 · 파라미터 이름 · 응답 형태 · 에러 해석)은 **이 디렉터리 밖으로 나가지 않는다** (INV-9). 실제 프로세스·네트워크에 닿는 부분을 별도의 얇은 trait으로 분리해(요청을 받아 상태 코드와 본문을 돌려주는 정도) 테스트가 double로 전 경로를 검증할 수 있게 한다 — 자동 테스트는 실제 Ollama 프로세스나 외부 네트워크에 의존하지 않는다(§18). 구현하는 것: 서버가 실행 중인지 확인, 설치된 모델 목록 읽기, structured note 생성(스트리밍을 끄고 ADR-0008이 택한 구조화 출력 수단을 쓴다). 엔드포인트와 파라미터 이름은 **ADR-0008이 재확인한 값만** 쓰고 기억이나 추측으로 쓰지 않는다. 연결 대상(host/port)은 P4의 설정에서 온 값을 주입받으며 어댑터 안에 하드코딩하지 않는다. 벤더 실패를 P3의 domain 공통 실패로 변환한다: 연결 거부 → 연결 불가, 비정상 상태 코드 → 요청 실패, 요청한 모델이 목록에 없음 → 모델 없음, 본문을 해석할 수 없거나 schema와 다름 → 응답 schema 불일치. **provider 설정값(host · port · 모델 이름)을 로그 · 에러 message · detail에 남기지 않는다.** Rust backend 호출이라면 필요한 HTTP 의존성을 ADR-0008의 선택대로 Cargo.toml에 추가하고 선택 이유를 주석으로 남긴다. 이 adapter는 P3의 재사용 가능한 계약 테스트 묶음을 그대로 통과해야 한다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-034
  - TASK-035

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC1
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      test Gate가 통과한다.
    verification:
      type: gate
      ref: test
  - id: AC4
    description: |-
      Ollama adapter가 P3의 계약 테스트 묶음을 fake provider와 동일하게 통과하고, 그 사실이 테스트 코드에서 확인된다 (INV-9 검증).
    verification:
      type: verifier
      instruction: |-
        같은 계약 테스트가 두 구현 모두에 적용되는지 확인한다. adapter 전용으로 따로 쓴 느슨한 테스트만 있으면 FAIL이다.
  - id: AC5
    description: |-
      자동 테스트가 실제 Ollama 프로세스나 외부 네트워크에 접속하지 않는다.
    verification:
      type: verifier
      instruction: |-
        테스트가 HTTP 경계 double을 쓰는지 확인한다. 실제 소켓 연결 · localhost:11434 접속 · 서버 기동을 시도하는 테스트가 있으면 FAIL이다.
  - id: AC6
    description: |-
      core/domain 코드에 Ollama 고유 타입 · URL · 파라미터 이름 · 에러 코드가 없다.
    verification:
      type: verifier
      instruction: |-
        domain/ · db/ · P2·P3의 모듈에서 ollama 문자열과 엔드포인트 경로를 찾는다. adapter 디렉터리 밖에 있으면 FAIL이다.
  - id: AC7
    description: |-
      네 가지 벤더 실패가 ADR-0008의 표대로 서로 다른 domain 실패로 변환되고, 설정값(host · port · 모델 이름)이 실패 message나 detail에 포함되지 않는다.
    verification:
      type: verifier
      instruction: |-
        실패 매핑 테스트를 확인하고, 실패 생성 경로가 설정값을 문자열에 넣는지 읽는다.

