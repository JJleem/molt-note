        ADR-0007을 읽고 규칙이 지금 구현 가능한 수준으로 확정됐는지 본다. '나중에 정한다'가 남아 있으면 실패다. 기존 §17 언어 기록이 지워지거나 다시 쓰이지 않았는지도 확인한다.
  - id: AC-2
