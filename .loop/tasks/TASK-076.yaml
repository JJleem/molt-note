# ADR 갱신 — 붕괴 판정 규칙과 입력 레벨 경계
# Runtime이 PLAN-20260907T032843Z 승인 시점에 생성했다 (proposal P1). 계획 서술은 여기 남기지 않는다.

id: TASK-076
status: DONE

request: |-
  문서만 바꾸는 Task다 — 소스 · 설정 · 의존성 · 테스트는 건드리지 않는다. (1) `docs/ADR-0007-transcription-engine.md`에 절을 더해 **전사 붕괴 판정 규칙**을 확정한다: 무엇을 붕괴로 볼 것인가(고유 문장 비율 · 최다 반복 문장의 점유율 · 규칙이 적용되기 시작하는 최소 segment 수), 그 임계값을 고른 근거(2026-09-07 실측 — segment 103 · 고유 2 = 1.9% · 최다 문장 99.0%; 2026-09-05 실측 — segment 1,749 · 고유 94.0%), 규칙이 사는 자리(파일시스템도 저장소도 네트워크도 모르는 순수 모듈 하나), 판정에 걸렸을 때 어떤 §13 실패가 되는가, 그리고 그 판정이 **저장을 막는 자리에 있지 저장된 것을 고치는 자리에 있지 않다**는 것(INV-2). 기존 §17(언어) 기록을 지우거나 다시 쓰지 않는다. 이 규칙이 **하지 않는 것**도 적는다 — 청크 분할 · state 재생성 · 반복 차단 · 자동 언어 감지 개선은 이 Phase 밖이며 다음 Phase 후보다. (2) `docs/ADR-0003-recording-engine.md`에 **녹음 입력 레벨 표시**의 경계 결정을 더한다: 레벨을 어디서 재는가(실시간 오디오 콜백이 아니라 파일에 쓰이는 통로), 무엇을 값으로 내보내는가(RMS · peak의 dBFS와 판정 구간과 사람이 읽는 문장), 판정 구간의 근거(9/4 평균 RMS 1685.5 = -25.8 dBFS로 성공 · 9/7 평균 RMS 255.7 = -42.2 dBFS로 붕괴 · 9/7 전체 피크 -19.4 dBFS), 그리고 **이 Phase가 마이크 게인을 조정하지도 오디오를 정규화하지도 않는다**는 것. 두 문서 모두 [관측된 사실] · [유력한 설명] · [미검증] 구분을 유지하고, R-3의 미검증 항목을 검증된 것처럼 적지 않는다.

