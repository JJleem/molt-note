# INV-8 · INV-6 교차 검증 — provider 없이 도는 core pipeline과 오디오 미전송
# Runtime이 PLAN-20260903T053705Z 승인 시점에 생성했다 (proposal P10). 계획 서술은 여기 남기지 않는다.

id: TASK-041
status: DONE

request: |-
  이 Phase의 두 번째 성공 기준을 전용 자동 테스트로 못박는다. 새 제품 기능을 추가하지 않고 **이미 만들어진 경로에 대한 검증만** 더한다. (1) INV-8 — AI provider가 하나도 설정되지 않은 상태에서 녹음(정지·파일 확정·영속화) · 전사(orchestration) · 열람(Recordings 목록 · Recording Detail · Transcript 탭)이 정상 동작함을 Rust와 frontend 양쪽에서 테스트한다. provider 미설정 · 연결 불가 · AI 생성 실패가 이 경로들 중 어느 것도 block하지 않고, 'provider 없음'이 오류가 아닌 정상 상태로 표현되는 것까지 포함한다. 전사 테스트는 실제 Whisper 없이 기존 test double과 fixture Transcript로 돈다(A-TRANS-001). (2) INV-6 — 오디오가 AI provider로 나갈 수 있는 경로가 코드 수준에서 존재하지 않음을 확인한다: AI 요청 타입에 오디오를 담을 자리가 없고, ai 모듈과 adapter가 오디오 파일을 열거나 읽지 않으며, 전송되는 것은 transcript 텍스트뿐이다. (3) provider 실패 세 종류(미실행 · 모델 없음 · 잘못된 응답) 뒤에도 Recording과 Transcript가 온전하고 실패가 UI 상태로 남아 재시도 가능함을 end-to-end에 가까운 테스트로 확인한다. 실제 Ollama 프로세스와 외부 네트워크에 의존하지 않는다.

execution:
  role: impl

