request: |-
  문서만 바꾸는 Task다. 소스와 설정은 건드리지 않는다. (1) `docs/ADR-0003-recording-engine.md`에 Phase 2B 추가 기록을 붙인다 — production 구현이 그 잠정 선택에서 무엇을 소비했고 무엇이 [A✓]로 바뀌었는지, 무엇이 여전히 [H]/[U]인지. **Status는 `PROVISIONAL` 그대로 두고 §12의 8개 항목은 `DEFERRED`로 남긴다 — CONFIRMED로 승격시키지 않는다.** (2) P2가 만든 recording lifecycle 문서를 완성한다: 녹음 session의 소유권 위치와 근거(R-001) · 파일 확정과 DB 저장의 순서와 보상 정책(두 어긋난 상태 각각) · 권한 판정 수단의 VERIFIED/UNVERIFIED 상태 · 샘플레이트와 채널 수는 여전히 장치가 정한다는 사실(리샘플링·다운믹스 없음). (3) 자동으로 판정할 수 없는 것을 Human Review 항목으로 명시한다: 실제 음질 · **장시간 녹음 안정성(사람이 한 번 수행 — Worker나 Verifier가 매번 장시간 녹음을 하지 않는다)** · 녹음 중 UI가 상태를 분명히 보여주는가 · dev 실행과 번들된 `.app` 양쪽에서의 권한 프롬프트. `docs/SYSTEM-MAP.md`는 고치지 않는다(Phase 종료 시 운영자가 한다). commit하지 않는다.

