# 전사에 걸린 시간을 기록으로 남긴다
# Runtime이 PLAN-20260905T201413Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-070
status: DONE

request: |-
  성공 기준 3의 나머지 절반을 만든다 — 전사 한 건에 실제로 걸린 시간이 남아 사람이 Metal 전후를 비교할 수 있어야 한다. (1) `src-tauri/src/transcription/run.rs`의 전사 실행 순서가 경과 시간을 재고(단조 시계로 재며, 재는 자리는 한 곳이다) 그 값을 Transcript와 함께 영속화한다. (2) `src-tauri/src/db/migrations.rs`의 목록 **끝에** migration을 더해 `transcripts`에 nullable 열 하나를 더한다 — 이미 적용된 migration은 고치지 않고, 이 값을 갖지 않는 옛 Transcript의 NULL은 '그때는 재지 않았다'는 정상 상태다. `src-tauri/src/db/store.rs`의 append/read 경로와 `domain`의 `Transcript`가 그 값을 함께 나른다. (3) `commands/payload.rs`와 `src/ipc/types.ts`를 지나 Transcript 탭의 provenance 자리(지금 `language` · `engine` · `model`이 보이는 곳 — `src/screens/transcriptView.ts`)에 도달한다. **사람이 읽을 문자열은 Rust가 만든다** — 이 저장소는 길이·시각의 표현을 backend에 두며 `tests/screen-boundary.test.ts`가 그것을 지킨다. 화면이 밀리초를 나눠 문장을 조립하지 않는다. (4) 값이 없는 옛 Transcript를 '0초'라고 말하지 않는다 — 모르는 것은 모른다고 말하거나 그 줄을 보이지 않는다. 이 Task는 실시간 진행률을 만들지 않는다(이 Phase의 성공 기준이 아니다).

execution:
  role: impl

