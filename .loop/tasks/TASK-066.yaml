  - id: AC1
    description: |-
      ADR-0007에 언어 처리 결정이 있고, whisper.cpp 기본값이 `en`이며 감지가 꺼져 있다는 사실과 그 근거 위치, 그리고 앞으로 무엇을 부를 것인가(고르지 않음 = 자동 감지)가 적혀 있다.
    verification:
      type: verifier
      instruction: |-
        문서에서 언어 결정 부분을 읽고, 관측 사실 · 원인 · 앞으로의 규칙이 구분되어 적혀 있는지 본다.
  - id: AC2
    description: |-
      Metal 결정이 있고, feature 이름이 실제 crate 소스나 공식 문서에서 확인된 값으로 확인 경로와 함께 적혀 있다. 확인하지 못했으면 UNVERIFIED로 표시돼 있다. 측정되지 않은 속도 수치나 배수가 문서에 없다.
    verification:
      type: verifier
      instruction: |-
        VERIFIED / UNVERIFIED 구분이 명시적인지, 속도 배수·소요 시간 추정치가 새로 들어가지 않았는지 확인한다.
  - id: AC3
    description: |-
      기존 절(특히 §4.3 · §16.3.1)이 삭제·축소되지 않았고, 이번 변경이 언제 왜 일어났는지가 이력으로 덧붙어 있다.
    verification:
      type: verifier
      instruction: |-
        변경 전후를 비교해 삭제된 문단이 없는지 본다.
  - id: AC4
    description: |-
      `docs/` 밖의 파일이 하나도 바뀌지 않았다 — 소스 · 설정 · 의존성 · 테스트 · Cargo.toml 모두 그대로다.
    verification:
      type: verifier

