# 붕괴 판정 순수 모듈
# Runtime이 PLAN-20260907T032843Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-077
status: DONE

request: |-
  P1의 ADR이 확정한 규칙을 Rust 순수 모듈 하나로 만든다(예: `src-tauri/src/transcription/collapse.rs`). 파일시스템 · 저장소 · 네트워크 · 시계 · 엔진을 알지 않는다. 입력은 이미 정규화된 segment 열(`parse::Transcription` 또는 그와 같은 값)이고, 출력은 **쓸 수 있다 / 붕괴했다**의 판정 하나와, 그 판정을 사람이 읽을 수 있게 하는 수치다(총 segment 수 · 고유 문장 수와 비율 · 최다 반복 문장의 점유율). 문장을 같다고 볼 규칙(공백 정규화 등)도 이 모듈이 정한다. **같은 규칙을 `run.rs`나 엔진이나 화면에 흩지 않는다** — 규칙이 사는 자리는 이 모듈 하나다. 단위 테스트로 최소한 다음을 고정한다: (a) segment 103개 중 고유 2개 · 한 문장이 99% → 붕괴, (b) 고유 94% → 통과, (c) segment가 최소 개수 미만인 짧은 전사에서 같은 말이 반복돼도 → 통과(짧은 녹음을 붕괴로 부르지 않는다), (d) 빈 열 → 쓸 수 없음, (e) 판정 값이 위의 수치를 잃지 않는다. 저장도 상태 변경도 이 Task가 하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-076

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC-1
    description: |-
      `npm run build`가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC-2
    description: |-
      `npm run lint`가 통과한다 (clippy `-D warnings` 포함).
    verification:
      type: gate
      ref: lint
  - id: AC-3
    description: |-
      `npm run test`가 통과하고, 그 안에 (a)~(e) 다섯 경우를 고정하는 새 단위 테스트가 실제로 있다.
    verification:
      type: gate
      ref: test
  - id: AC-4
    description: |-
      모듈이 순수하다 — 파일시스템 · rusqlite · 네트워크 · 시계 · 엔진 타입에 대한 의존이 없고, 판정 규칙이 이 모듈 밖에 복제되지 않았다.
    verification:
      type: verifier
      instruction: |-
        새 모듈의 use 구문과 본문을 읽고 확인한다. 같은 임계값이나 비율 계산이 run.rs · engine.rs · 화면 쪽에 중복돼 있으면 실패다.
  - id: AC-5
    description: |-
      판정 결과가 P1의 ADR이 적은 규칙과 임계값에 일치한다.
    verification:
      type: verifier

evidence: []

failure_memo: []
