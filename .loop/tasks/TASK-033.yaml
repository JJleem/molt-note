# Structured Note schema · 방어적 파싱 · 프롬프트와 promptVersion
# Runtime이 PLAN-20260903T053705Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-033
status: DONE

request: |-
  ADR-0008이 확정한 세 mode의 structured note를 순수 모듈로 구현한다(예: src-tauri/src/ai/note.rs · prompt.rs — 위치는 ADR-0008의 호출 주체 결정을 따른다). 담을 것은 넷이다. (1) NoteMode(meeting · study · summary)와 mode별 structured note 타입, 그리고 ai_notes.content에 저장할 직렬화/역직렬화 — 같은 값을 저장했다 읽으면 그대로 돌아온다. (2) provider에게 요구할 JSON Schema를 이 타입으로부터 만드는 자리 — 벤더 전송 형식이 아니라 schema 그 자체이며, 어느 벤더의 파라미터 이름도 여기 있지 않다. (3) **기대와 다른 응답에 대한 방어** — 필드 누락 · 타입 불일치 · 배열 자리에 문자열 · 알 수 없는 추가 필드 · JSON이 아닌 산문 · 코드펜스로 감싼 JSON · 빈 본문에서 panic하거나 unwrap으로 죽지 않고, 안전하게 복구하거나 '응답이 기대 schema와 다름'을 뜻하는 실패 값으로 돌려준다. 이것은 로컬 소형 모델에서 자주 일어나는 일이므로 예외 경로가 아니라 기본 경로로 설계한다. (4) mode별 프롬프트와 promptVersion — 프롬프트 텍스트가 바뀌면 promptVersion이 반드시 바뀐다는 것을 테스트가 강제한다(예: 프롬프트 내용에서 유도하거나, 상수를 두되 내용과의 결속을 테스트가 고정한다). transcript 텍스트를 프롬프트 입력으로 준비하는 자리(ADR-0008의 context 전략 — num_ctx 명시 · 청킹 · 절단 중 택한 것)도 여기 둔다. 이 모듈에는 HTTP · 네트워크 · 파일 접근 · 벤더 타입이 없고, 오디오를 다루는 코드도 없다. 실제 Ollama 없이 도는 단위 테스트를 함께 쓴다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-032

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC1
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      test Gate가 통과한다.
    verification:
      type: gate
      ref: test
  - id: AC4
    description: |-
      세 mode의 타입이 ADR-0008이 확정한 schema와 일치하고 §9.5의 출력 섹션을 모두 표현하며, content 직렬화가 round-trip한다.
    verification:
      type: verifier
      instruction: |-
        ADR-0008 §(d)의 schema와 코드의 타입을 필드 단위로 대조한다. round-trip 테스트가 실제로 존재하는지 확인한다.
  - id: AC5
    description: |-
      기대와 다른 응답에 대한 방어가 최소 다섯 가지 서로 다른 비정상 입력(필드 누락 · 타입 불일치 · JSON 아님 · 코드펜스 · 빈 본문 등)으로 테스트되고, 어느 경우에도 panic하지 않는다.
    verification:
