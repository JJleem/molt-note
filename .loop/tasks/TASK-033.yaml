      instruction: |-
        테스트 케이스를 센다. unwrap/expect가 파싱 경로에서 사용자 입력(응답 본문)에 대해 쓰이는 곳이 없는지 확인한다.
  - id: AC6
    description: |-
      프롬프트가 바뀌면 promptVersion이 바뀐다는 것이 테스트로 강제된다.
    verification:
      type: verifier
      instruction: |-
        프롬프트 텍스트와 promptVersion의 결속을 고정하는 테스트가 있는지 본다. 버전 상수가 프롬프트와 독립적으로 존재해 조용히 어긋날 수 있으면 FAIL이다.
  - id: AC7
    description: |-
      이 모듈에 벤더 고유 이름 · 엔드포인트 · 파라미터 이름 · 에러 코드가 없고, 네트워크/파일/오디오 접근이 없다.
    verification:
      type: verifier
      instruction: |-
        모듈 소스를 읽고 ollama · claude · gemini · groq 같은 벤더 식별자, URL, HTTP 의존성, 오디오 경로 사용이 있는지 확인한다.

