  requires_verifier: true
  max_consecutive_failures: 2

acceptance_criteria:
  - id: AC-1
    description: |-
      lint Gate가 통과한다 (frontend ESLint + `cargo clippy --all-targets -D warnings`).
    verification:
      type: gate
      ref: lint
  - id: AC-2
    description: |-
      test Gate가 통과하고, 새 순수 모듈의 단위 테스트가 세 mode의 프롬프트 · AI-ready 문서 · Transcript 텍스트의 기대 문자열과 결정성을 고정한다.
    verification:
      type: gate
      ref: test
  - id: AC-3
    description: |-
      `src-tauri/src/ai/prompt.rs`의 프롬프트 상수와 `PROMPT_VERSION_*` 선언값이 하나도 바뀌지 않았고, Manual 프롬프트가 그 상수를 재사용해 만들어진다. 두 번째 프롬프트 세트가 생기지 않았다.
    verification:
      type: verifier
      instruction: |-
        prompt.rs의 diff가 비어 있는지 확인하고, 새 모듈이 prompt_template 계열을 실제로 재사용하는지 본다. 프롬프트 문장을 복사해 붙인 자리가 있으면 실패다.
  - id: AC-4
    description: |-
      transcript/문서 렌더링 규칙이 복제되지 않았다 — `export::markdown`의 기존 함수에서 갈라지거나 공용으로 끌어올려 한 자리에서 쓰인다.
    verification:
      type: verifier
  - id: AC-5
    description: |-
      새 모듈의 입력 타입과 산출물에 audio 경로도 audio 바이트도 담을 자리가 없고(MH-4), 벤더 이름이 없다(MH-6). 파일·clipboard·네트워크·저장소를 쓰는 코드가 이 모듈에 없다.
    verification:
      type: verifier

