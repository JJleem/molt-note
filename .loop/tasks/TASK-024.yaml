  - id: AC4
    description: |-
      변환이 원본 raw recording 파일을 수정·삭제·이동하지 않는다. 변환 전후 원본 바이트가 동일함을 확인하는 테스트가 있고, 파생 산출물의 경로가 원본 경로와 같아질 수 없다.
    verification:
      type: verifier
