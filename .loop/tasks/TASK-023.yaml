acceptance_criteria:
  - id: AC1
    description: |-
      세 후보가 §14.4.2 정책 아래에서 비교되고 하나가 선택되며, 탈락 후보와 탈락 이유가 적혀 있다. cmake 부재나 '언어가 Rust라서'가 선택 근거로 쓰이지 않고, C는 A·B의 실증된 blocker 없이는 선택되지 않는다.
    verification:
      type: verifier
      instruction: |-
        선택 근거 문단을 읽고 §14.4.2의 세 제약이 실제로 지켜졌는지 확인한다. 근거 없이 정책을 되풀이하기만 한 문서는 통과가 아니다.
  - id: AC2
    description: |-
      릴리스 아티팩트가 (a) macOS CLI 실행 파일 (b) XCFramework/라이브러리 (c) 소스 빌드 (d) Windows 아티팩트로 구분되어 기록되고, XCFramework의 존재가 macOS whisper-cli의 존재로 취급되지 않는다. 각 항목에 근거와 확인 시점이 있고, 확인하지 못한 것은 UNVERIFIED로 표기된다.
    verification:
      type: verifier
  - id: AC3
    description: |-
      선택한 통합 방식이 실제로 내는 timestamp 단위가 근거와 함께 기록되고, start_ms · end_ms로의 정규화를 코드의 어느 한 경계에서만 한다는 것이 명시된다.
    verification:
      type: verifier
  - id: AC4
    description: |-
      모델 관리 정책과 '모델 없음'을 제품 상태로 표현한다는 규칙, 그리고 모델·큰 바이너리를 저장소에 커밋하지 않는다는 규칙이 적혀 있다.
    verification:
      type: verifier
  - id: AC5
    description: |-
      입력 포맷 변환 책임과 수단이 정해지고, 최종 사용자에게 whisper.cpp·Homebrew·CMake·ffmpeg 설치를 요구하지 않는다는 결론이 근거와 함께 적힌다. 원본 raw recording을 변환해 덮어쓰지 않는다는 규칙(INV-1·INV-3)이 명시된다.
    verification:
      type: verifier
  - id: AC6
    description: |-
      tauri#11992가 '배포 불가'로 단정되지 않고 관찰 증거와 미확인 경계로 기록된다. Windows 성립 여부 평가가 있고, Windows 빌드·바이너리 확보·실행 검증은 Phase 6으로 남는다는 것이 명시된다.
    verification:
      type: verifier
  - id: AC7
    description: |-
      이 Task는 문서만 추가·수정했다. 소스 파일 · tauri.conf.json · Cargo.toml · package.json은 변경되지 않았다.
