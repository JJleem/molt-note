# ADR-0010 — Manual AI Handoff 산출물과 clipboard 경계 결정 (문서 전용)
# Runtime이 PLAN-20260904T075433Z 승인 시점에 생성했다 (proposal P1). 계획 서술은 여기 남기지 않는다.

id: TASK-055
status: DONE

request: |-
  `docs/ADR-0010-manual-ai-handoff.md`를 새로 쓴다. **문서만 만드는 Task다 — 소스 · 설정 · 의존성 · 테스트를 건드리지 않는다.** 담을 것은 다섯이다. (1) 이 Phase가 로드맵에 없던 삽입이라는 사실과 두 제품 방향 변경(Transcript를 외부 AI 채팅에 사람이 넘기는 경로를 제품 기능으로 추가 · Ollama를 '첫 provider · 기본 AI 경험'에서 '선택적 · 로컬 · 고급'으로 내림)을 날짜와 근거와 함께 기록한다. Spec 본문 갱신은 이 Phase의 마지막 문서 Task가 하므로 여기서는 결정과 근거만 남긴다. (2) **AI-ready 산출물의 형식을 확정한다** — 어떤 섹션이 어떤 순서로 들어가는지(모드 · 지시 · Recording 메타데이터 · Transcript), timestamp를 어떤 표현으로 적는지, 그리고 그것이 `src-tauri/src/export/markdown.rs`의 `ExportDocument`와 `format_timestamp_ms`를 **어떻게 재사용하는지**. 병렬 export 시스템도 두 번째 렌더링 규칙도 만들지 않는다는 것을 형식 수준에서 못박는다. (3) **`ai::prompt` 재사용 방식을 확정한다** — `MEETING_PROMPT` · `STUDY_PROMPT` · `SUMMARY_PROMPT` · `TRANSCRIPT_PLACEHOLDER` 상수를 **고치지 않고** 그대로 재사용하면서 '출력을 구조화된 Markdown으로 달라'는 지시를 어떻게 얹는지. 상수를 고치면 `PROMPT_VERSION_*` 선언값과 계산값이 어긋나 테스트가 깨지고 이미 저장된 provenance가 거짓이 된다는 사실을 근거로 적는다. 두 번째 프롬프트 세트를 만들지 않는다. (4) **clipboard 경계의 자리를 결정한다** — 후보(프론트엔드의 작은 platform 모듈 하나 · Rust command 하나 · Tauri clipboard 플러그인)를 비교하고 채택과 탈락 근거를 남긴다. 새 의존성을 더하는 선택이면 그 필요를 근거로 적고, 확인하지 못한 플랫폼 능력은 **UNVERIFIED로 남긴다**(지어내지 않는다). 실패가 어떻게 사용자에게 보이고 재시도되는지, 그리고 clipboard가 거절되는 환경에서도 Export for AI가 대체 경로로 남는다는 것을 함께 적는다. (5) 이 Phase가 열 **command 이름과 개수**, 그리고 MH-1~MH-8 각각을 무엇으로 판정할 것인지의 대응표. `tests/ipc-boundary.test.ts`의 등록 목록과 tripwire 정규식이 새 이름에서 깨진다는 사실도 예고해 둔다. 벤더 이름(ChatGPT · Claude · Gemini)이 산출물과 core/domain에 들어가지 않는다는 것을 결정으로 남긴다.

