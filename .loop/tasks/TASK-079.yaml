# 붕괴 실패가 화면에서 읽힌다
# Runtime이 PLAN-20260907T032843Z 승인 시점에 생성했다 (proposal P4). 계획 서술은 여기 남기지 않는다.

id: TASK-079
status: DONE

request: |-
  지금 `src/screens/transcriptView.ts`의 `failureCause`는 `transcriptionOutputUnusable`을 `'other'`로 뭉개고, 그 갈래에는 사용자가 먼저 할 일을 담은 문장이 없다(`RESOLUTION.other === null`). Rust가 나눠 보낸 구분을 화면이 다시 뭉개지 않도록 이 갈래를 별도 원인으로 가르고, 그 갈래의 안내 문장을 둔다 — 무엇이 일어났는가(전사가 붕괴했다)와 무엇을 하면 되는가(녹음 입력 레벨을 확인하고 다시 녹음한다 · 다른 모델을 고른다 · 다시 시도한다). 재시도 수단과 `TRANSCRIPTION_PRESERVED_NOTICE`(아무것도 지워지지 않았다)는 그대로 유지한다. **규칙은 순수 모듈에 있고 `RecordingDetailScreen.tsx`는 그리기만 한다.** `src/screens/transcriptView.test.ts`에 새 갈래와 문장, 그리고 다른 갈래(모델 없음 · 모델 사용 불가 · 이유 모름)가 흐려지지 않았다는 것을 고정한다. 새 벤더 고유 개념을 타입에 만들지 않는다 (INV-9) — `tests/ipc-boundary.test.ts`가 그대로 통과해야 한다. UI 리디자인은 하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
