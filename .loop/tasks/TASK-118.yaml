  - id: P2-AC4
    description: |-
      aiNoteView 테스트가 다음을 단언한다. 주제 섹션 제목이 '1. 제목' 꼴로 번호 한 번만 갖는다('1. 제목', '1) 제목', '제목' 입력 모두). '2026년 계획'과 '3D 재구성'은 원문이 보존되고 번호만 붙는다. 다른 섹션의 제목과 목록 모양은 그대로다.
    verification:
      type: verifier
      instruction: |-
        src/screens/aiNoteView.ts와 테스트 diff를 읽고, 규칙이 P1의 Rust 규칙과 같은 사례에 대해 같은 결과를 내는지 확인한다.

