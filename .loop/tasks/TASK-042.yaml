    verification:
      type: verifier
      instruction: |-
        문서의 각 항목을 해당 소스 파일과 대조한다. 구현되지 않은 것을 구현된 것처럼 적었으면 FAIL이다.
  - id: AC2
    description: |-
      docs/PHASE-4-AI-NOTE-REVIEW.md가 존재하고, 준비 · 관찰 항목 · 기록 방법이 사람이 그대로 따라 할 수 있을 만큼 구체적이다. Ollama를 앱이 설치하거나 번들하지 않는다는 전제가 명시된다.
    verification:
      type: verifier
      instruction: |-
        Goal의 Human Review 다섯 항목이 모두 절차에 들어 있는지 확인한다.
  - id: AC3
    description: |-
      실제 Ollama 호출이 이 Phase에서 한 번도 일어나지 않았다는 사실과 A-TRANS-001이 UNVERIFIED로 명시되어 있고, 실행하지 않은 결과가 사실처럼 서술되지 않았다.
    verification:
      type: verifier
