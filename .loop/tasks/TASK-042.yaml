        문서에서 실측처럼 읽히는 수치(처리 시간 · 품질 판단 등)를 찾는다. 근거 없는 값이 있으면 FAIL이다.
  - id: AC4
    description: |-
      문서 외의 파일이 변경되지 않았고 docs/SYSTEM-MAP.md도 그대로이며, 새 commit이 없다.
    verification:
      type: verifier
      instruction: |-
        변경 목록을 확인한다. 소스 · 설정 · SYSTEM-MAP 변경이나 commit이 있으면 FAIL이다.

