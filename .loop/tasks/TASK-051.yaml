# Recording Detail · Recordings 목록 — Export와 Send to Notion
# Runtime이 PLAN-20260904T025945Z 승인 시점에 생성했다 (proposal P9). 계획 서술은 여기 남기지 않는다.

id: TASK-051
status: DONE

request: |-
  사용자가 실제로 누르는 자리를 만든다. Recording Detail(`src/screens/RecordingDetailScreen.tsx`)에 **`Export Markdown`**과 **`Send to Notion`**을 넣고, Recordings 목록과 Detail에 Notion 상태(`none` · `pending` · `running` · `done` · `failed`)를 보인다 (요구 9). 표시 로직은 기존 관례대로 순수 view 모듈(`src/screens/` 아래)에 두고 컴포넌트는 그리기만 한다 — 그래야 아래 조건이 실제 앱 없이 테스트된다. 반드시 테스트로 남아야 하는 것(P-3): **AI provider 없이 Markdown export가 된다 · AI Note 없이 Markdown export가 된다 · export 실패가 원본 데이터를 훼손하지 않는다.** 그 밖에: 실패는 §13대로 무엇이 실패했는지 · 원본은 안전한지 · 다시 시도할 수 있는지를 보이고 재시도 수단을 준다(부분 전송 후 실패도 그 사실이 드러난다); **무엇이 전송되는지 화면에 드러난다 — 전송되는 것은 노트/전사 텍스트이고 오디오는 나가지 않는다** (INV-5 · INV-6); 같은 Recording을 두 번 보냈을 때 무슨 일이 일어나는지가 ADR-0009의 중복 sync 정책 그대로 **버튼을 누르기 전에 예측 가능하게** 적혀 있다. export 성공은 쓰인 파일 경로를 사용자에게 알린다.

execution:
  role: impl

