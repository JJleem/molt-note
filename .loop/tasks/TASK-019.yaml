# macOS 마이크 권한 — 요청 · 거부 감지 · 도메인 상태화
# Runtime이 PLAN-20260902T080012Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-019
status: DONE

request: |-
  macOS 마이크 권한 흐름을 `src-tauri/src/platform/` 아래의 경계 안에 구현한다(§13 · §3.1의 PlatformPermissions 자리). 캡처를 시작하기 전에 권한을 요청하고, 상태(허용 · 거부 · 아직 결정되지 않음)를 감지해 domain의 `Failure`/상태 값으로 옮긴다. 거부 상태는 사용자가 무엇을 해야 하는지(시스템 설정 › 개인정보 보호 및 보안 › 마이크) 알 수 있는 메시지를 담고, 녹음 초기화 실패와 구분된다. **외부 능력을 추측하지 않는다** — 사용하는 API/crate의 현재 버전과 실제 지원 범위를 도입 시점에 확인하고, 확인된 것과 확인하지 못한 것을 VERIFIED / UNVERIFIED로 구분해 문서에 남긴다. 신뢰할 수 있는 판정 수단을 확인하지 못하면 장치 열기 실패를 권한 문제로 분류해 안내하되 그 한계를 UNVERIFIED로 명시한다. macOS 지식이 domain으로 새지 않게 하고(INV-10), Windows 권한 로직은 만들지 않는다(Phase 6). 자동 테스트는 이 경계에 가짜 구현을 넣어 마이크와 실제 권한 없이 돈다 — 거부 상태에서는 캡처가 시작되지 않고 사용자에게 보이는 상태가 되는 것을 테스트로 판정한다. commit하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-016

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 2

acceptance_criteria:
  - id: AC1
    description: |-
      test Gate가 통과한다. 권한 경계에 가짜 구현을 넣어 허용/거부/미결정 각각의 결과가 마이크 없이 판정되고, 거부 상태에서 캡처가 시작되지 않는 것이 테스트로 확인된다.
    verification:
      type: gate
      ref: test
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC4
    description: |-
      권한 상태가 domain 공통 실패/상태로 표현되고, macOS 전용 지식이 platform 경계 안에만 있다. 사용한 외부 API/crate의 지원 범위가 VERIFIED / UNVERIFIED로 구분되어 기록됐고, 확인하지 못한 것이 확인된 것처럼 적히지 않았다.
    verification:
      type: verifier
      instruction: |-
        소스와 문서를 확인한다: (1) macOS 전용 호출이 platform 경계 안에만 있고 domain에 없다(INV-10), (2) 거부 상태의 안내 문구가 사용자가 읽을 수 있는 문장이다, (3) 새 의존성을 도입했다면 실제 버전과 지원 범위가 기록되어 있다, (4) 자동으로 확인할 수 없는 것(실제 TCC 프롬프트)이 PASS로 적히지 않고 Human Review 항목으로 남아 있다, (5) Windows 권한 로직이 만들어지지 않았다.

