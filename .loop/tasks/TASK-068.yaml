    verification:
      type: gate
      ref: test
  - id: AC3
    description: |-
      `npm run build`가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC4
    description: |-
      언어 선택이 엔진 경계에 값으로 도달하며, test double이 그것을 관측하는 테스트가 있다 — 고르지 않았을 때는 감지, 골랐을 때는 그 언어 지정으로 갈린다.
    verification:
      type: verifier
      instruction: |-
        테스트가 실제 whisper 없이 그 갈림을 판정하는지, 그리고 `whisper.rs`가 설정이나 저장소를 직접 읽지 않는지 확인한다.
  - id: AC5
    description: |-
      `whisper.rs`가 `set_language`와 `set_detect_language`를 실제로 부르고, `Transcript.language`는 여전히 엔진이 보고한 값이다(설정 값을 결과로 베껴 넣지 않는다). `set_translate(false)`가 유지된다.
    verification:
      type: verifier

