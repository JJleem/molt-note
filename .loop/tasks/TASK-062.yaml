# 네 주요 화면을 UI 기반 위에 올린다
# Runtime이 PLAN-20260904T075433Z 승인 시점에 생성했다 (proposal P8). 계획 서술은 여기 남기지 않는다.

id: TASK-062
status: DONE

request: |-
  P7의 토큰과 규칙을 **Recordings(홈) · Recording · Recording Detail · Settings** 네 화면에 적용한다. 지금 `src/`에는 하드코딩된 `font-size`가 17곳, `padding`/`margin` px 값이 36곳 있다 — 그것을 타입·여백 스케일로 옮겨 화면마다 임의의 값이 흩어지지 않게 한다. 화면별 요구는 넷이다. (1) **Recordings**: 목록의 모든 행을 무거운 카드로 만들지 않는다. 여백과 타이포로 구분한다. (2) **Recording**: 상태와 주 조작(Record/Pause/Resume/Stop)이 화면을 지배한다 — 보기 좋으라고 기능적 명확성을 희생하지 않는다. (3) **Recording Detail**: 내용 위계가 이해되게 한다. **탭을 다른 것으로 갈아엎지 않는다.** (4) **Settings**: 단순한 그룹 목록. 설정마다 장식 카드를 두지 않는다. 여기에 더해 **빈 상태 다섯 갈래**(녹음 없음 · transcript 없음 · AI Note 없음 · provider 없음 · Notion 미설정)가 고장난 것처럼 보이지 않게 하고, 오래 걸리는 동작이 얼어붙은 것처럼 보이지 않게 로딩을 표시한다. 접근성 기준선을 지킨다 — 키보드로 조작 가능 · 보이는 focus · 컨트롤에 레이블 · 합리적 대비 · **색만으로 상태를 말하지 않는다**(상태에 언제나 텍스트가 동반된다) · disabled 구분 가능 · semantic button/input. 이미 있는 `role`/`aria-*` 사용을 깨뜨리지 않는다. **비즈니스 로직을 컴포넌트로 옮기지 않는다** — 순수 view 모듈(`src/screens/<name>View.ts`)의 판정 규칙을 표현을 위해 바꾸지 않으며, 이 Task가 바꾸는 것은 표현 계층과 CSS다. 시각 방향은 깨끗함 · 밝음 · 차분함 · 높은 정보 명료도 · 넉넉한 여백 · 최소 장식이고, 경쟁하는 색을 여럿 쓰지 않는다. 최종 비주얼 리디자인이 아니라 나중의 다듬기가 딛고 설 바닥까지다.

