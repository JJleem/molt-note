# 로컬 영속 저장소 초기화와 migration 경로
# Runtime이 PLAN-20260901T035729Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-002
status: DONE

request: |-
  로컬 영속 저장소를 Rust 경계 안에 만든다. PRODUCT-SPEC §14.7의 방향에 따라 rusqlite(bundled feature)를 src-tauri/Cargo.toml에 추가하고, DB 파일은 P1의 AppDataDirectory가 돌려주는 경로에 만든다. 연결 열기·초기화·스키마 버전 관리·migration 실행을 담당하는 모듈을 만든다: migration은 순서가 있는 목록으로 코드에 선언되고, 현재 스키마 버전(PRAGMA user_version 또는 전용 테이블)을 보고 아직 적용되지 않은 것만 적용하며, 같은 DB에 두 번 실행해도 안전해야 한다. 스키마가 바뀔 때 사용자 데이터를 지우는 경로(DROP/DELETE로 초기화하는 방식)를 만들지 않는다(INV-4의 정신). 이 Task에서는 §7의 도메인 테이블을 만들지 않아도 되며, migration 뼈대와 최소 1개의 migration만 있으면 된다. 아울러 docs/ADR-0001-local-persistence.md를 새로 작성해 (a) 왜 tauri-plugin-sql이 아니라 Rust 경계 안의 rusqlite인지, (b) 실제 사용된 crate 이름·해석된 버전(src-tauri/Cargo.lock 기준)·feature 이름을, 확인한 출처와 함께 VERIFIED / UNVERIFIED로 구분해 기록한다. 공식 출처를 열 수 없으면 추측하지 말고 UNVERIFIED로 남기고 그 사실을 문서에 드러낸다. 임시 디렉터리에서 동작하는 cargo 테스트를 추가하고 npm run lint와 npm run test를 직접 실행한다. git commit은 하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-001

stop_condition:
  gates: [lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC1
    description: |-
      npm run lint가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC2
    description: |-
      npm run test가 통과한다.
    verification:
      type: gate
      ref: test
  - id: AC3
    description: |-
      테스트가 (a) 빈 디렉터리에서 DB가 생성되고 스키마 버전이 최신이 되는 것, (b) 연결을 닫았다가 같은 경로로 다시 열면 기존 행이 그대로 남아 있는 것, (c) migration을 두 번 실행해도 데이터가 유실되지 않는 것을 실제로 검증한다.
    verification:
      type: verifier
      instruction: |-
        추가된 테스트를 읽고 세 시나리오가 실제 assertion으로 존재하는지 확인한다. 특히 (b)가 '연결을 닫고 다시 연다'를 실제로 수행하는지, 단순히 같은 연결에서 SELECT만 하는 것은 아닌지 본다.
  - id: AC4
    description: |-
      docs/ADR-0001-local-persistence.md가 선택 근거와 crate 이름·버전·feature를 evidence와 함께 기록하며, 확인하지 못한 사실을 VERIFIED로 주장하지 않는다.
    verification:
      type: verifier
      instruction: |-
        ADR을 읽고 각 주장에 근거가 붙어 있는지, Cargo.lock의 실제 해석 버전과 문서의 서술이 일치하는지, UNVERIFIED 항목이 정직하게 표시되어 있는지 확인한다.
  - id: AC5
    description: |-
      스키마 변경 시 사용자 데이터를 지우는 경로가 코드에 없다.
    verification:
      type: verifier
      instruction: |-
        migration 실행 코드에 DROP TABLE / DELETE FROM / 파일 삭제 후 재생성 같은 데이터 파괴 경로가 있는지 확인한다.

evidence: []

failure_memo: []
