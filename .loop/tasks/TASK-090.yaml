# smoke test 문서의 '전사가 성공한 파일' 서술을 정정한다 (성공 기준 3 · 문서 전용)
# Runtime이 PLAN-20260907T074302Z 승인 시점에 생성했다 (proposal P5). 계획 서술은 여기 남기지 않는다.

id: TASK-090
status: DONE

request: |-
  문서만 바꾸는 Task다 — 소스 · 설정 · 의존성 · 테스트를 건드리지 않는다. `docs/PHASE-3-TRANSCRIPTION-SMOKE-TEST.md`의 §부록2가 `capture-1788522158.wav`를 `9/4 녹음 · 전사가 성공한 파일`이라고 적은 서술(§부록2-1 '대상과 조건' 표 · 731행 부근)을 사실에 맞게 정정한다. 사실은 이렇다: 그 파일의 **제품 경로 전사는 FAIL이며** 같은 문서의 '결과 1'이 그것을 기록하고 있다(segment 1,711 · 고유 59 · 3.4% · 같은 문장 1,063회). 94.0%라는 PASS는 **저장소 밖의 검증용 도구에서 조건 셋을 바꿔** 얻은 것이다. 정정은 **덮어쓰기가 아니라 정정**이다 — 기존 문장을 통째로 지우지 않고, 무엇이 틀렸는지 · 무엇이 사실인지 · 그 서술이 어느 Task(TASK-083)에서 언제 들어왔는지 · 언제 누가 정정했는지가 남는 형태로 고친다(문서가 이미 쓰는 취소선/`[정정]` 표기나 정정 각주 중 이 문서의 기존 표기 관행에 맞는 방식을 쓴다). 그리고 이 정정이 **무엇을 무효로 만들지 않는지**를 함께 적는다: `ADR-0003 §16.1`의 레벨 목표 -25.8 dBFS는 실측값이므로 유효하며, 틀린 것은 '그 파일은 전사가 성공했다'는 서술 하나다. §부록2의 P8 실험은 그 레벨 값을 목표로 삼은 것이지 '성공한 전사'를 목표로 삼은 것이 아니라는 점이 정정 뒤에도 읽히게 한다. 같은 문서 안에 같은 오해를 만드는 다른 서술이 더 있으면 그것도 같은 방식으로 정정하고, 없으면 없다고 적는다. 다른 문서(`docs/ADR-0003-recording-engine.md` · `docs/ADR-0007-transcription-engine.md` · `phase-prompt/`)는 이 Task에서 바꾸지 않는다.

