# Markdown 렌더러가 주제 번호를 한 번만 붙인다
# Runtime이 PLAN-20261125T051038Z 승인 시점에 생성했다 (proposal P1). 계획 서술은 여기 남기지 않는다.

id: TASK-117
status: DONE

request: |-
  src-tauri/src/export/markdown.rs의 render_topic은 지금 `## {number}. {title}`로 번호를 붙이는데, 모델도 topics[].title에 번호를 붙여서 `## 1. 1. 제목`이 나온다. 같은 파일에 순수 함수를 만든다(예: strip_leading_topic_number). 이 함수는 제목 앞의 번호 꼴을 딱 한 번 뗀다. 그 꼴은 맨 앞 공백, ASCII 또는 전각 숫자 1개 이상(앞의 0 허용), 선택적 공백, 구분자 '.' · '．' · ')' · '）' 중 하나, 그리고 공백 또는 문자열 끝이다. 번호처럼 보이지 않는 제목('2026년 계획', '3D 재구성', '1.5배 성장')은 그대로 둔다. 떼고 나서 제목이 비면 원래 제목을 쓴다. render_topic은 single_line을 거친 제목에 이 함수를 적용한 뒤 `## {number}. {title}`로 렌더한다. 저장된 노트 데이터는 바꾸지 않는다. Notion 전송도 이 Markdown을 쓰므로 함께 고쳐진다. 단위 테스트를 추가한다: '1. 제목', '1) 제목', '제목', '01. 제목', '１. 제목', '1 . 제목'은 모두 `## 1. 제목`이 된다. '2026년 계획'은 `## 1. 2026년 계획`이 되고, '3D 재구성'은 `## 1. 3D 재구성`이 된다. 두 번째 주제는 `## 2.`로 번호가 매겨진다. 이 변경 때문에 깨지는 기존 Rust 테스트와 e2e 테스트의 기대값은 새 규칙에 맞게 고친다. 실제 provider 호출은 하지 않는다.

