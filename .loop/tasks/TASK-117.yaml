  - id: P1-AC4
    description: |-
      Rust 테스트가 다음을 단언한다. '1. 제목', '1) 제목', '제목'은 모두 `## 1. 제목`이 된다. '2026년 계획'과 '3D 재구성'은 원문 그대로 남고 번호만 앞에 붙는다. '01.'과 '１.' 꼴도 한 번만 떼어진다. render_topic은 렌더러 번호를 정확히 한 번 붙이고, 저장 데이터를 수정하는 코드는 없다.
