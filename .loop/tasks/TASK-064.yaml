# UI 기반 불변 전용 자동 테스트
# Runtime이 PLAN-20260904T075433Z 승인 시점에 생성했다 (proposal P10). 계획 서술은 여기 남기지 않는다.

id: TASK-064
status: DONE

request: |-
  **새 화면 기능을 추가하지 않고**, 이 Phase의 두 번째 성공 기준을 전용 테스트로 못박는다. `tests/` 아래에 UI 기반 검사 파일을 두고(원문을 읽어야 하므로 `src/`가 아니다 — 기존 `tests/screen-boundary.test.ts`와 같은 자리이며 그 파일의 `sourceFiles`는 `.css`도 읽는다) 다섯 가지를 판정한다. (1) **타입 스케일과 여백 스케일 토큰이 정의돼 있고, 주요 화면이 그것을 쓴다** — 임의의 하드코딩 `font-size` 개수가 기준선 이하로 고정되어 다시 늘면 검사가 먼저 깨진다. (2) **보이는 focus 상태가 존재한다** — `:focus` / `:focus-visible` 스타일이 0곳이 아니다. (3) **새로 더한 색 토큰이 `prefers-color-scheme: dark` 블록에도 정의돼 있다** — dark mode 장치가 깨지지 않았다. (4) **금지된 장식이 들어오지 않았다** — gradient · glassmorphism(backdrop-filter) · 과한 그림자 · 장식적 애니메이션. (5) **색만으로 상태를 말하지 않는다** — 상태를 표현하는 순수 view 모듈의 값에 언제나 사람이 읽는 텍스트가 함께 있다는 것을 값 수준에서 확인한다. 각 검사에는 **무엇을 지키려는 검사인지** 주석으로 남긴다 — 숫자 기준선을 쓰는 검사는 그 숫자가 목표가 아니라 회귀 방지선이라는 것을 함께 적는다. **픽셀/스크린샷 비교 테스트를 추가하지 않는다.** 검사를 통과시키려고 화면을 형식적으로 바꾸지 않는다 — 기준을 충족하지 못하면 그 사실이 드러나야 한다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-062

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 2

acceptance_criteria:
  - id: AC-1
    description: |-
      test Gate가 통과하고, 다섯 검사(타입/여백 스케일 사용 · 보이는 focus · dark 블록의 새 토큰 · 금지 장식 부재 · 색만으로 상태를 말하지 않음)가 실제로 존재한다.
    verification:
      type: gate
      ref: test
  - id: AC-2
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC-3
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC-4
    description: |-
      각 검사에 무엇을 지키려는 검사인지가 주석으로 남아 있고, 숫자 기준선이 회귀 방지선임이 명시돼 있다.
    verification:
      type: verifier
  - id: AC-5
    description: |-
      픽셀/스크린샷 비교 테스트가 추가되지 않았고, 검사를 통과시키기 위한 형식적 화면 변경이 없다.
    verification:
      type: verifier

evidence: []

