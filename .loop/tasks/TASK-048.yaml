# 긴 markdown 문서의 무손실 분할 — 순수 모듈
# Runtime이 PLAN-20260904T025945Z 승인 시점에 생성했다 (proposal P6). 계획 서술은 여기 남기지 않는다.

id: TASK-048
status: DONE

request: |-
  긴 Markdown 문자열 하나를 ADR-0009가 정한 **앱이 고른 chunk 예산** 아래에서 순서대로 나누는 순수 모듈을 만든다. 판정 기준은 상수의 크기가 아니라 이것이다 — **전체 문서가 · 순서대로 · 무손실로 나뉜다.** 즉 나눈 결과를 순서대로 이어 붙이면 원문과 **정확히 같아야 한다.** 나누는 자리는 문서 구조를 깨지 않는 안전한 경계(섹션 · 문단 · 줄 경계 등, ADR-0009의 기준)여야 하며, **어떤 경우에도 조용히 자르지 않는다.** 한 chunk에 담을 수 없는 원자 단위(예산보다 긴 한 줄)를 만났을 때의 동작을 명시적으로 결정하고 테스트한다 — 조용한 절단은 선택지가 아니다. 예산 상수는 코드 주석에서 **이 앱이 고른 값이며 확인된 Notion API 한도가 아니라는 것**과, 옛 2000자 rich text · 100블록 규칙(블록 JSON 경로의 규칙)에서 유도된 값이 아니라는 것을 밝힌다. 테스트에는 (a) 예산보다 작아 나뉘지 않는 문서, (b) 여러 chunk로 나뉘는 문서, (c) **1시간 분량 transcript 규모의 입력**, (d) 원자 단위가 예산을 넘는 경우가 포함되고, 모든 경우에 재조립이 원문과 바이트 단위로 같음을 고정한다. 이 모듈은 네트워크 · 저장소 · 파일 시스템을 알지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
