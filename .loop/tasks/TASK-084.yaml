# 이 Phase의 불변을 전용 테스트로 못박는다
# Runtime이 PLAN-20260907T032843Z 승인 시점에 생성했다 (proposal P9). 계획 서술은 여기 남기지 않는다.

id: TASK-084
status: DONE

request: |-
  **새 제품 기능을 추가하지 않고**, 이미 만들어진 경로로 이 Phase의 불변을 `tests/` 아래 전용 테스트에 고정한다(`tests/screen-boundary.test.ts` · `tests/ipc-boundary.test.ts`의 선례를 따라 원문을 읽는 검사는 `tests/`에 둔다). 고정할 것: (a) 레벨을 알리는 경로가 오디오 샘플 자체를 화면이나 네트워크로 내보내지 않는다 (§14.4.2 · INV-6). (b) 붕괴 판정 규칙이 한 자리에만 있다 — 임계값과 비율 계산이 `run.rs` · 엔진 · `src/` 화면 쪽에 복제돼 있지 않다. (c) 화면 쪽에 dBFS 계산과 레벨 판정 임계값이 없다 — backend가 준 값과 문장을 그대로 쓴다. (d) 캡처 경로가 샘플을 바꾸지 않는다 — 이 Phase는 게인도 정규화도 적용하지 않으므로, 들어온 샘플이 그대로 파일에 쓰인다. (e) 새 벤더 고유 개념이 core/domain · payload · frontend 타입에 생기지 않았다 (INV-9 — 기존 `tests/ipc-boundary.test.ts` 검사가 그대로 통과한다). 제품 코드를 고쳐야만 통과하는 테스트를 쓰지 않는다 — 통과하지 않는다면 그것은 앞선 Task가 남긴 진짜 결함이므로 그 사실을 보고한다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-079
  - TASK-082

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: AC-1
    description: |-
      `npm run build`가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC-2
    description: |-
      `npm run lint`가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC-3
    description: |-
      `npm run test`가 통과하고, (a)~(e) 다섯 불변을 각각 판정하는 테스트가 `tests/` 아래에 실재한다.
    verification:
      type: gate
      ref: test
  - id: AC-4
    description: |-
      테스트가 실제로 불변을 지킨다 — 규칙을 복제하거나 화면에 dBFS 계산을 넣으면 실패하도록 쓰였다. 통과만을 위한 빈 단언이 아니다.
    verification:
      type: verifier
  - id: AC-5
    description: |-
      이 Task가 제품 동작을 바꾸지 않았다 — 새 기능도 새 payload 필드도 추가되지 않았다.
    verification:
      type: verifier

evidence: []

failure_memo: []
