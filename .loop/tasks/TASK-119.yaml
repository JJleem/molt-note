# Meeting 프롬프트가 주제 제목 번호를 금지하고 promptVersion이 바뀐다
# Runtime이 PLAN-20261125T051038Z 승인 시점에 생성했다 (proposal P3). 계획 서술은 여기 남기지 않는다.

id: TASK-119
status: DONE

