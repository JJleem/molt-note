  src-tauri/src/ai/prompt.rs의 MEETING_PROMPT를 고친다. topics 설명 줄(현재 86행 부근의 "topics" 항목) 근처에 영어 지시 한 문장을 추가한다. 내용은 topics[].title에 번호나 순서 표기(예: '1.', '1)', '01.')를 붙이지 말라는 것이고, 번호는 앱이 붙인다는 점도 적는다. 해시 강제 규칙에 따라 PROMPT_VERSION_MEETING 선언값을 새 계산값으로 바꾼다. 그 값을 고정한 기존 테스트 기대값도 같이 고친다. Study와 Summary 프롬프트와 그 버전은 바꾸지 않는다. prompt.rs의 테스트 모듈에 MEETING_PROMPT가 제목 번호 금지 지시를 담고 있음을 단언하는 테스트를 추가한다. 실제 provider 호출은 하지 않는다.

