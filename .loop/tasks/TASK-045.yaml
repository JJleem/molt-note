      ref: test
  - id: P3-AC4
    description: |-
      Recording 하나가 실제 Markdown 파일로 쓰이고, 파일명과 내용이 ADR-0009 · §11과 일치한다는 것이 임시 디렉터리 테스트로 확인된다.
    verification:
      type: verifier
  - id: P3-AC5
    description: |-
      AI Note가 없는 Recording의 export가 성공하며, 그 경로에 대한 테스트가 있다 (INV-8).
    verification:
