  - id: P3-AC6
    description: |-
      쓰기 실패가 domain Failure로 표현되고 원본 데이터를 훼손하지 않는다 — 실패 후에도 recording · transcript · ai_note가 그대로임을 테스트가 확인한다 (INV-3).
    verification:
      type: verifier
  - id: P3-AC7
    description: |-
      이름 충돌 정책이 ADR-0009대로 구현되고 테스트로 고정돼 있다 (기존 파일을 조용히 덮어쓰지 않는다).
    verification:
      type: verifier

