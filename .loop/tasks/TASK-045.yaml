    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: P3-AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: P3-AC3
    description: |-
      test Gate가 통과한다.
    verification:
