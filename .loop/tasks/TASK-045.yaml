# Markdown 파일 쓰기 경계와 export command
# Runtime이 PLAN-20260904T025945Z 승인 시점에 생성했다 (proposal P3). 계획 서술은 여기 남기지 않는다.

id: TASK-045
status: DONE

request: |-
  P2의 순수 렌더러를 실제 파일로 떨어뜨리는 경계와 그것을 부르는 Tauri command를 만든다. 쓰기 대상 디렉터리와 **같은 이름이 이미 있을 때의 정책**은 ADR-0009가 정한 대로 구현한다. 실행 순서는 저장소에서 Recording · current Transcript(§7.2) · (있으면) 최신 AI Note를 읽어 P2의 렌더러에 넣고, 파일명을 만들고, 파일을 쓰고, 쓰인 경로를 돌려주는 것이다. **AI provider가 설정되지 않았거나 AI Note가 하나도 없다는 이유로 거절하지 않는다** (INV-8). 실패(디렉터리를 만들지 못함 · 쓰기 실패 · 대상이 없음)는 전부 `crate::domain::Failure`로 옮겨 §13의 세 질문에 답하고, **어떤 실패 경로도 recording · transcript · ai_note를 고치거나 지우지 않는다** (INV-3). 오디오 파일은 복사하지도 읽지도 않는다 (INV-6). frontend 쪽에는 `src/ipc/commands.ts`와 `src/ipc/types.ts`에 대응하는 함수와 타입을 더하고 command 등록(`src-tauri/src/lib.rs`)까지 맞춘다. 자동 테스트는 임시 디렉터리에서 수행하며 사용자의 실제 export 디렉터리를 건드리지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-044

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

