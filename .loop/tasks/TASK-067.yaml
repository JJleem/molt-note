# 전사 언어 설정을 저장소부터 화면까지 추가한다
# Runtime이 PLAN-20260905T201413Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-067
status: DONE

request: |-
  PRODUCT-SPEC §D가 이미 요구하는 전사 `language` 설정을 end-to-end로 만든다. (1) `src-tauri/src/db/migrations.rs`의 `MIGRATIONS` **끝에 새 migration을 더한다** — 이미 적용된 migration의 version이나 sql은 고치지 않고, `settings`에 nullable 열 하나를 `ALTER TABLE`로 더한다. NOT NULL도 DEFAULT도 두지 않는다: 기본값 정책은 `domain::settings::Settings::DEFAULT`가 갖는다는 이 테이블의 규약을 그대로 따르며, NULL은 '아직 고르지 않았다' = **언어를 자동으로 감지한다**는 정상 상태다. secret 열은 여전히 만들지 않는다(INV-7). (2) `src-tauri/src/domain/settings.rs`의 `Settings`에 필드와 `DEFAULT`(고르지 않음)를 더하고, 왜 로캘을 짐작해 굳혀 두지 않는지를 기존 필드들과 같은 밀도의 주석으로 남긴다. (3) `src-tauri/src/db/settings.rs`의 `load` · `save`가 그 값을 함께 읽고 쓴다 — 저장된 값이 유효한 언어 코드인지 묻지 않고, 없다고 해서 지우거나 바꾸지 않는다(`transcription_model`과 같은 규칙). (4) `src-tauri/src/commands/payload.rs`의 설정 payload와 `src/ipc/types.ts`의 `Settings`에 같은 값을 더한다. (5) `src/screens/settingsView.ts`의 `SettingsForm` · `toForm` · `toSettings`에 더한다 — **폼을 지나가지 않으면 다른 설정을 저장할 때마다 사용자가 고른 언어가 조용히 `null`이 된다**(`notionParentPageId` 주석이 말하는 그 실패다). 빈 입력은 '고르지 않음'(`null`)이며 앞뒤 공백만 뺀다. (6) `src/screens/SettingsScreen.tsx`의 Transcription 구역에 그 입력을 놓는다 — Phase 5.5가 세운 구역 구성을 바꾸지 않고 그 안에 더하며, 표현 규칙은 순수 모듈(`settingsView.ts`)에 두고 컴포넌트는 그리기만 한다. 고르지 않은 상태가 오류가 아니라 '자동 감지'라는 사실이 화면의 말로 드러나야 한다. 이 Task는 전사 실행 경로를 아직 건드리지 않는다 — 값이 저장되고 다시 읽히는 데까지다.

