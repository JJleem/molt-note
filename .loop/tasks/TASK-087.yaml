# 청크 분할 · 오프셋 복원 · 반복 차단을 순수 Rust 모듈로 만든다
# Runtime이 PLAN-20260907T074302Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-087
status: DONE

request: |-
  P1이 ADR-0007에 확정한 규칙을 **파일시스템도 저장소도 네트워크도 엔진도 모르는 순수 Rust 모듈** 하나로 만든다 (예: `src-tauri/src/transcription/chunking.rs`, `src-tauri/src/transcription/mod.rs`에 등록). `collapse.rs` · `parse.rs`가 세운 선례를 그대로 따른다 — 이 모듈에는 `std::fs` · `rusqlite` · 네트워크 · `whisper_rs` · `WhisperContext`가 등장하지 않고, 입력과 출력이 전부 값이다. 담을 것은 셋이다. (1) **어디서 자르는가** — 전체 샘플 수와 샘플레이트(16 kHz)를 받아 청크 목록을 만든다. 각 청크는 시작 프레임 · 길이(프레임) · 전체 시간축에 대한 오프셋을 값으로 갖는다. 오프셋 단위는 P1이 정한 원시 단위다. (2) **청크 결과를 전체 시간축으로 되돌려 합치는가** — 청크 하나가 낸 `RawSegment` 열(청크 로컬 timestamp)과 그 청크의 오프셋을 받아 전체 시간축의 `RawSegment` 열로 옮기고, 여러 청크의 결과를 순서대로 이어 하나로 만든다. P1이 겹침을 두기로 했다면 겹친 구간의 병합도 여기서 일어난다. 단위 변환은 하지 않는다 — 더하기만 한다. (3) **연속 반복을 어디서 끊는가** — P1이 정한 임계값으로 연속 반복 segment를 차단한다. 임계값과 청크 길이는 **이 모듈의 상수 한 자리에만** 정의하며 다른 파일에 같은 숫자를 다시 적지 않는다. 단위 테스트가 경계값을 고정한다: 샘플이 하나도 없을 때 · 청크 길이보다 짧을 때 · 정확히 청크 길이의 배수일 때 · 배수 + 1 프레임일 때(마지막 짧은 청크) · 오프셋이 실제로 더해져 두 번째 청크의 시각이 되감기지 않을 때 · 반복 차단 임계값의 바로 아래와 바로 위 · 연속이 아닌 반복은 자르지 않을 때 · 텍스트가 없는 segment가 섞였을 때. 새 의존성을 추가하지 않는다. 기존 파일 중 `mod.rs`의 모듈 등록과 재수출 외에는 건드리지 않는다 — 엔진 결선은 다음 Task의 일이다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-086

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 3

acceptance_criteria:
  - id: P2-AC1
    description: |-
      `npm run build`가 통과한다.
    verification:
      type: gate
      ref: build
  - id: P2-AC2
    description: |-
      `npm run lint`가 통과한다 (`cargo clippy --all-targets -- -D warnings` 포함).
    verification:
      type: gate
      ref: lint
  - id: P2-AC3
    description: |-
      `npm run test`가 통과하고, 새 모듈의 단위 테스트가 그 안에서 실제로 돈다.
    verification:
      type: gate
      ref: test
  - id: P2-AC4
    description: |-
      새 모듈이 순수하다 — 파일시스템 · 데이터베이스 · 네트워크 · `whisper_rs` 타입을 쓰지 않고, 실제 모델도 오디오 파일도 없이 값만으로 테스트된다.
    verification:
      type: verifier
      instruction: |-
        새 모듈의 use 선언과 본문을 읽어 fs · rusqlite · 네트워크 · whisper_rs 의존이 없는지 확인한다.
  - id: P2-AC5
    description: |-
      단위 테스트가 request가 열거한 경계값(빈 입력 · 청크 미만 · 정확한 배수 · 배수+1 · 오프셋 누적 · 반복 차단 임계값의 위아래 · 비연속 반복 · 텍스트 없는 segment)을 실제로 고정한다.
    verification:
      type: verifier
  - id: P2-AC6
    description: |-
      청크 길이와 반복 차단 임계값이 코드에서 한 자리에만 정의되어 있고, 그 값과 근거가 P1이 ADR-0007에 확정한 것과 일치한다. 새 crate 의존성이 `Cargo.toml`에 추가되지 않았다.
    verification:
      type: verifier

