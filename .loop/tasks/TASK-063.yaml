# Manual Handoff 불변 MH-1~MH-8 전용 자동 테스트
# Runtime이 PLAN-20260904T075433Z 승인 시점에 생성했다 (proposal P9). 계획 서술은 여기 남기지 않는다.

id: TASK-063
status: DONE

request: |-
  **새 제품 기능을 추가하지 않고**, 이미 만들어진 경로로 이 Phase의 여덟 불변을 전용 테스트에 못박는다 (Phase 4의 `core_pipeline_without_ai.rs` · `coreWithoutAi.test.ts`, Phase 5의 `notion_and_export_invariants.rs`와 같은 자리다). MH-1 · MH-2 — AI Provider가 하나도 설정되지 않은 상태에서 Copy AI Prompt · Copy Transcript · Export for AI가 **전부 동작한다**. Ollama를 요구하지 않는다. MH-3 — 복사와 export 경로에 네트워크로 나가는 코드가 없다(사용자의 로컬 행동이다). MH-4 — AI-ready 산출물과 그 입력 타입에 audio 경로도 바이트도 없다. 소스/타입 수준에서 확인한다. MH-5 — 현재 성공한 Transcript(`current_transcript_id`)만 쓰이고, 실패했거나 대체된 옛 version을 고르는 경로가 없다. MH-6 — 산출물과 core/domain · payload · frontend 타입에 벤더 이름과 벤더 고유 schema가 없다. MH-7 — 복사와 export가 실패해도 Recording · Transcript · AINote · 기존 export가 훼손되지 않는다(실패 경로에 저장소 쓰기가 없다). MH-8 — 기존 Connected Provider 생성 경로가 그대로 동작한다(기존 테스트가 계속 통과한다). 판정은 값 수준 테스트와 원문 검사를 함께 쓴다 — Rust 쪽은 `src-tauri/tests/` 아래에, frontend/원문 쪽은 `tests/` 아래에 둔다(`src/`는 브라우저 코드로 타입 검사되어 `node:fs`를 쓸 수 없다). **자동 테스트가 실제 provider · 실제 Notion · 실제 자격증명 저장소 · 실제 시스템 clipboard를 건드리지 않는다.** 픽셀/스크린샷 비교 테스트를 추가하지 않는다. 테스트를 통과시키려고 제품 코드의 불변을 무르게 고치지 않는다 — 불변이 실제로 깨져 있으면 그 사실을 드러낸다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
