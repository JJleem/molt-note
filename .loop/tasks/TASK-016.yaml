# backend가 소유하는 녹음 session — Record · Pause · Resume · Stop
# Runtime이 PLAN-20260902T080012Z 승인 시점에 생성했다 (proposal P2). 계획 서술은 여기 남기지 않는다.

id: TASK-016
status: DONE

request: |-
  Phase 2A의 start/stop 한 쌍짜리 `Capture`(`src-tauri/src/commands/mod.rs`)를 production 녹음 session으로 대체한다. P1의 상태 기계를 기존 `SampleSource` 경계와 엮어서 start(고른 장치를 열고 파일에 쓰기 시작) · pause(진행 중인 session과 열린 출력 파일을 유지한 채 샘플이 파일에 도달하지 않게 한다) · resume(같은 파일로 이어 쓴다) · stop(파일을 확정한다)을 구현한다. 녹음 session의 소유권은 **Tauri managed state에 둔다 — 화면 컴포넌트가 소유하지 않는다(R-001).** 프론트엔드가 부를 수 있도록 pause · resume · 현재 상태 조회 command를 추가하고, 상태 조회는 현재 상태 · 경과 ms · **Rust가 만든 경과 시간 문자열**을 함께 돌려준다(TypeScript가 길이를 계산하지 않게 한다). cpal을 아는 코드는 `system_capture.rs` · `system_devices.rs` 두 파일 안에만 남기고, 가짜 SampleSource로 start → pause → resume → stop 전체 경로가 마이크 없이 테스트되게 한다. 녹음 session의 소유권을 어디에 두었고 왜인지를 새 문서(예: `docs/ADR-0004-recording-session-lifecycle.md`)에 기록한다. ADR-0003의 Status는 건드리지 않는다. commit하지 않는다.

execution:
  role: impl

# 선행 Task. 전부 DONE이 되기 전까지 이 Task는 READY가 되지 않는다.
depends_on:
  - TASK-015

stop_condition:
  gates: [build, lint, test]
  requires_verifier: true
  max_consecutive_failures: 2

acceptance_criteria:
  - id: AC1
    description: |-
      test Gate가 통과한다. 가짜 SampleSource로 start → pause → resume → stop 전체 경로가 실행되며, pause 동안 들어온 샘플이 파일에 쓰이지 않고 결과가 하나의 파일로 확정되는 것이 테스트로 확인된다.
    verification:
      type: gate
      ref: test
  - id: AC2
    description: |-
      lint Gate가 통과한다.
    verification:
      type: gate
      ref: lint
  - id: AC3
    description: |-
      build Gate가 통과한다.
    verification:
      type: gate
      ref: build
  - id: AC4
    description: |-
      녹음 session이 backend의 managed state에 소유되고 화면 컴포넌트의 lifecycle에 묶여 있지 않다(R-001). 그 결정과 근거가 문서에 기록되어 있다.
    verification:
      type: verifier
      instruction: |-
        소스와 문서를 읽고 확인한다: (1) 진행 중인 session의 소유자가 Tauri managed state이며 React 컴포넌트가 session 핸들을 소유하지 않는다, (2) 상태 조회 command가 상태·경과 ms·Rust가 만든 경과 시간 문자열을 돌려준다, (3) cpal을 참조하는 파일이 system_capture.rs와 system_devices.rs 둘뿐이다, (4) 소유권 결정과 근거가 문서에 있다. ADR-0003의 Status가 PROVISIONAL 그대로인지도 확인한다.

evidence: []

failure_memo: []
