# ADR-0009 — Notion & Markdown Export 아키텍처 결정
# Runtime이 PLAN-20260904T025945Z 승인 시점에 생성했다 (proposal P1). 계획 서술은 여기 남기지 않는다.

id: TASK-043
status: DONE

request: |-
  `docs/ADR-0009-notion-and-export.md`를 새로 쓴다. **문서만 만드는 Task다 — 소스 · 설정 · 의존성 · 테스트를 건드리지 않는다.** 기존 ADR(0003 · 0007 · 0008)의 형식을 따르며, 이 Phase가 뒤이어 구현할 결정 여덟 가지를 근거와 함께 확정한다: (1) export 디렉터리의 위치와 파일명 규칙, 그리고 **같은 이름이 이미 있을 때의 정책**; (2) 쓸 Notion API 계약 — `POST /v1/pages`의 `markdown` body param으로 페이지 생성, `PATCH /v1/pages/:page_id/markdown`(`insert_content` + `position: {type: "end"}`)로 이어붙이기, 연결 확인은 `GET /v1/users/me`, 헤더는 `Authorization: Bearer <secret>`와 **`Notion-Version: 2026-03-11`**(§14.9.2 — 조사 날짜를 버전으로 쓰지 않는다); (3) markdown 문자열을 나눌 **앱이 고른 보수적 chunk 예산** — VERIFIED된 일반 요청 한도(요청당 1000 block elements · 500KB overall) 아래에서 JSON 이스케이프와 요청 부가분을 감안해 고르고, **그것이 확인된 API 한도가 아니라 이 앱이 고른 값임을 명시한다.** markdown 엔드포인트 전용 상한은 값이 존재하는지조차 확인되지 않았으므로 UNVERIFIED로 남기고, primary source에서 확인되지 않은 숫자(예: 750KB)를 사실로 적지 않는다; (4) `allow_async` 사용 여부와 그 비용; (5) **중복 sync 정책** — 기존 페이지 갱신인가 명시적 중복 생성인가, 그리고 부분 성공 뒤 재시도가 조용히 중복 페이지를 만들지 않도록 무엇을(비-secret 상태) 언제 영속화하는가; (6) `429`/`529`의 `Retry-After`(정수 초) 존중 규칙; (7) **SecretStore 경계** — `src-tauri/src/platform/` 아래 trait 하나 · macOS 보안 저장소 구현 · Windows 구현 경계 · 자동 테스트용 메모리 test double 구성, 그리고 쓸 crate를 **현재 플랫폼 feature 구성을 실제로 확인한 뒤** 고른 근거. token을 두지 않는 자리(SQLite · frontend 영속화 · 소스 · 커밋된 .env · 로그 · evidence)를 명시한다; (8) 현재 `src-tauri/Cargo.toml`의 `ureq = { version = "3.4", default-features = false }`에서 **지원되는 TLS 경로를 어떻게 켜는가** — 확인한 버전과 feature 이름을 그대로 기록한다. 외부 사실은 전부 `VERIFIED` / `UNVERIFIED`로 구분해 적고, 확인하지 못한 것을 확인한 것처럼 쓰지 않는다.

