[package]
name = "molt-note"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "molt_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 로컬 영속 저장소. persistence ownership을 Rust 경계 안에 둔다 (PRODUCT-SPEC §14.7 · docs/ADR-0001-local-persistence.md).
# `bundled`는 SQLite C 소스를 함께 빌드하므로 시스템에 설치된 SQLite 버전에 의존하지 않는다.
rusqlite = { version = "0.40", features = ["bundled"] }
# 입력 장치 열거. ADR-0003이 잠정 선택한 native 오디오 경로다 (PRODUCT-SPEC §14.3).
# macOS는 CoreAudio · Windows는 WASAPI 백엔드를 쓰므로 플랫폼 분기가 이 crate 안에 있다 (INV-10).
cpal = "0.18"
# WAV writer. ADR-0003이 잠정 선택한 조합(`cpal` + `hound`)의 나머지 절반이며,
# 파일을 만드는 Task가 함께 추가했다. WAV(RIFF)는 길이를 헤더에 갖는 포맷이므로
# writer를 정상 종료해야 재생 가능한 파일이 된다 (ADR-0003 §5.5).
# 알려진 한계: 3.5.1은 2023-09 이후 릴리스가 없다(dormant) — ADR-0003 §9.
hound = "3"

