[package]
name = "molt-note"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "molt_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset`는 저장된 녹음을 webview가 재생할 수 있게 하는 통로다 (Phase 2B 요구사항 7).
# 이 feature가 켜져야 `asset:` 프로토콜과 `Manager::asset_protocol_scope()`가 존재한다.
# **켠다고 파일이 열리는 것은 아니다** — 실제로 읽을 수 있는 자리는 scope가 정하며,
# 이 앱은 녹음 디렉터리 하나만 허용한다 (`crate::run` · PRODUCT-SPEC §12 · INV-6).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 로컬 영속 저장소. persistence ownership을 Rust 경계 안에 둔다 (PRODUCT-SPEC §14.7 · docs/ADR-0001-local-persistence.md).
# `bundled`는 SQLite C 소스를 함께 빌드하므로 시스템에 설치된 SQLite 버전에 의존하지 않는다.
rusqlite = { version = "0.40", features = ["bundled"] }
# 입력 장치 열거. ADR-0003이 잠정 선택한 native 오디오 경로다 (PRODUCT-SPEC §14.3).
# macOS는 CoreAudio · Windows는 WASAPI 백엔드를 쓰므로 플랫폼 분기가 이 crate 안에 있다 (INV-10).
cpal = "0.18"
# WAV writer. ADR-0003이 잠정 선택한 조합(`cpal` + `hound`)의 나머지 절반이며,
# 파일을 만드는 Task가 함께 추가했다. WAV(RIFF)는 길이를 헤더에 갖는 포맷이므로
# writer를 정상 종료해야 재생 가능한 파일이 된다 (ADR-0003 §5.5).
# 알려진 한계: 3.5.1은 2023-09 이후 릴리스가 없다(dormant) — ADR-0003 §9.
hound = "3"
# 전사 엔진. ADR-0007이 sidecar(A)와 비교해 고른 B다 — 엔진은 `cargo build`의 산출물 안으로
# 들어가고 **배포물에 추가로 넣는 실행 파일이 없다.** 그래서 `tauri.conf.json`에
# `bundle.externalBin`도, target triple 파일명 규약도, shell 권한도 없다 (ADR-0007 §2 · §4.2).
# 빌드 시점에 CMake + C/C++ 툴체인을 요구한다 — **개발 빌드 의존성이지 사용자 의존성이 아니다**
# (PRODUCT-SPEC §14.4.2 · ADR-0007 §7). 그 대가로 cold build가 whisper.cpp 컴파일을 포함한다
# (ADR-0007 §4.3).
# 알려진 한계: 번들 whisper.cpp가 upstream보다 낮고(v1.8.3 vs v1.9.3), 유지보수가
# GitHub → Codeberg로 이동했다 (ADR-0007 §4.3). 그래서 버전을 핀하고 교체 비용을 작게 둔다
# (§13 — 교체 대상은 `transcription::whisper` 하나다).
whisper-rs = "0.16"
# 샘플레이트 변환. ADR-0007 §9.2가 고른 순수 Rust 경로의 나머지 절반이다
# (`hound` 읽기 + `rubato` 리샘플 + 수동 다운믹스). 외부 도구를 요구하지 않는 것이
# 선택 이유이며, 그래서 제품 경로는 ffmpeg을 부르지 않는다 (§14.4.2 · ADR-0007 §7).
rubato = "5"

