[package]
name = "molt-note"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "molt_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset`는 저장된 녹음을 webview가 재생할 수 있게 하는 통로다 (Phase 2B 요구사항 7).
# 이 feature가 켜져야 `asset:` 프로토콜과 `Manager::asset_protocol_scope()`가 존재한다.
# **켠다고 파일이 열리는 것은 아니다** — 실제로 읽을 수 있는 자리는 scope가 정하며,
# 이 앱은 녹음 디렉터리 하나만 허용한다 (`crate::run` · PRODUCT-SPEC §12 · INV-6).
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 로컬 영속 저장소. persistence ownership을 Rust 경계 안에 둔다 (PRODUCT-SPEC §14.7 · docs/ADR-0001-local-persistence.md).
# `bundled`는 SQLite C 소스를 함께 빌드하므로 시스템에 설치된 SQLite 버전에 의존하지 않는다.
rusqlite = { version = "0.40", features = ["bundled"] }
# 입력 장치 열거. ADR-0003이 잠정 선택한 native 오디오 경로다 (PRODUCT-SPEC §14.3).
# macOS는 CoreAudio · Windows는 WASAPI 백엔드를 쓰므로 플랫폼 분기가 이 crate 안에 있다 (INV-10).
cpal = "0.18"
# WAV writer. ADR-0003이 잠정 선택한 조합(`cpal` + `hound`)의 나머지 절반이며,
# 파일을 만드는 Task가 함께 추가했다. WAV(RIFF)는 길이를 헤더에 갖는 포맷이므로
# writer를 정상 종료해야 재생 가능한 파일이 된다 (ADR-0003 §5.5).
# 알려진 한계: 3.5.1은 2023-09 이후 릴리스가 없다(dormant) — ADR-0003 §9.
hound = "3"
# 전사 엔진. ADR-0007이 sidecar(A)와 비교해 고른 B다 — 엔진은 `cargo build`의 산출물 안으로
# 들어가고 **배포물에 추가로 넣는 실행 파일이 없다.** 그래서 `tauri.conf.json`에
# `bundle.externalBin`도, target triple 파일명 규약도, shell 권한도 없다 (ADR-0007 §2 · §4.2).
# 빌드 시점에 CMake + C/C++ 툴체인을 요구한다 — **개발 빌드 의존성이지 사용자 의존성이 아니다**
# (PRODUCT-SPEC §14.4.2 · ADR-0007 §7). 그 대가로 cold build가 whisper.cpp 컴파일을 포함한다
# (ADR-0007 §4.3).
# 알려진 한계: 번들 whisper.cpp가 upstream보다 낮고(v1.8.3 vs v1.9.3), 유지보수가
# GitHub → Codeberg로 이동했다 (ADR-0007 §4.3). 그래서 버전을 핀하고 교체 비용을 작게 둔다
# (§13 — 교체 대상은 `transcription::whisper` 하나다).
whisper-rs = "0.16"
# 샘플레이트 변환. ADR-0007 §9.2가 고른 순수 Rust 경로의 나머지 절반이다
# (`hound` 읽기 + `rubato` 리샘플 + 수동 다운믹스). 외부 도구를 요구하지 않는 것이
# 선택 이유이며, 그래서 제품 경로는 ffmpeg을 부르지 않는다 (§14.4.2 · ADR-0007 §7).
rubato = "5"
# HTTP 클라이언트. ADR-0008 §12.2가 고른 것이다 — wrapper crate(`ollama-rs`)를 쓰지 않고
# REST를 직접 부르며, **동기(blocking)** 클라이언트를 쓴다. 이 저장소의 모든 경계가 동기이고
# (`TranscriptionEngine` · `NoteAiProvider`) 오래 걸리는 일은 평범한 스레드로 UI 밖에서 돈다.
# 호출 하나 때문에 async runtime을 들이지 않는다 (PRODUCT-SPEC §20.5).
# 쓰는 자리는 `ai::ollama::network` 하나이며, 그 위는 얇은 trait이라 교체 비용이 파일 하나다.
#
# `default-features = false`를 **유지한다** (ADR-0009 §11.2-1) — 기본값을 다시 켜면 압축 ·
# 쿠키 · 프록시처럼 이 앱이 쓰지 않는 것이 함께 들어온다. 필요한 것만 이름으로 켠다.
#
# ★ TLS — Phase 5는 HTTPS로 나간다 (Notion). 그래서 TLS 경로를 **명시적으로 하나 켠다.**
#   켠 feature 이름:  `rustls`      (ADR-0009 §11.3의 1순위 — 순수 Rust TLS 구현)
#   확인한 버전:      ureq 3.4.0    (`Cargo.lock`이 checksum까지 고정한다)
#   루트 인증서 출처: `webpki-roots`(번들된 루트) — `Cargo.lock`이 실제로 무엇을 들여왔는지로
#                     판정했다. OS 신뢰 저장소를 쓰는 구성이 아니다.
#   판정 근거:        `.loop/evidence/TASK-047/ureq-tls-verification.md`
#                     (ADR-0009 §11.4: "feature를 켰다고 적어 두고 lock이 그대로면 켜지지 않은
#                      것이다" — before는 lock에 TLS crate가 하나도 없는 상태였다)
# **인증서 검증을 끄는 구성은 없다** — 설정으로도 개발용 플래그로도 두지 않는다 (§11.2-3).
# token이 실려 나가는 연결이다.
#
# MSRV는 확인하지 못했다 — `.loop/evidence/TASK-036/verification-log.md`.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
# 보낸 문서의 지문(sha256 hex). ADR-0009 §8.4의 `content_fingerprint`가 쓰는 것이며,
# **끝나지 않은 전송을 이어 붙여도 되는가**를 판정하는 유일한 근거다 (§8.2).
#
# 이것은 자격증명을 다루지 않는다 — 해시가 걸리는 값은 이미 사용자에게 보이는 markdown 문서
# 하나이고, token은 여기에도 저장소에도 오지 않는다 (INV-7 · §10.5).
#
# 이미 이 저장소의 `Cargo.lock`에 들어와 있던 crate다(전이 의존성). 지문 하나 때문에 새 코드를
# 손으로 쓰지 않으며, 쓰는 자리는 `sync::run::content_fingerprint` 하나다.
sha2 = "0.10"

